<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: 'rgb(var(--c-bg) / <alpha-value>)',
          surface: 'rgb(var(--c-surface) / <alpha-value>)',
          panel: 'rgb(var(--c-panel) / <alpha-value>)',
          line: 'rgb(var(--c-line) / <alpha-value>)',
          muted: 'rgb(var(--c-muted) / <alpha-value>)',
          accent: 'rgb(var(--c-accent) / <alpha-value>)',
          accent2: 'rgb(var(--c-accent2) / <alpha-value>)'
        },

      }

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  :root {
    --c-bg: 8 8 11;
    --c-surface: 14 14 18;
    --c-panel: 20 20 25;
    --c-line: 36 36 44;
    --c-muted: 138 138 151;
    --c-elev: 21 21 26;
    --c-accent: 124 107 255;
    --c-accent2: 154 140 255;
    --accent: rgb(var(--c-accent));
    --line: rgb(var(--c-line));
  }
  * { -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: rgb(var(--c-bg)); color: #f4f4f6;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    overscroll-behavior-y: none;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgb(var(--c-line)); border-radius: 99px; border: 2px solid rgb(var(--c-bg)); }
  ::-webkit-scrollbar-thumb:hover { background: rgb(var(--c-muted)); }
  .no-sb::-webkit-scrollbar { display: none; }
  .no-sb { scrollbar-width: none; -ms-overflow-style: none; }

  .sw { width: 44px; height: 26px; border-radius: 99px; background: #2a2a33; position: relative; transition: background .2s ease; flex: none; }
  .sw.on { background: var(--accent); }
  .sw span { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 99px; background: #fff; transition: transform .2s cubic-bezier(.3,.9,.4,1); }
  .sw.on span { transform: translateX(18px); }

  .pl-top { background: linear-gradient(to bottom, rgba(0,0,0,.82), rgba(0,0,0,0)); }
  .pl-bottom { background: linear-gradient(to top, rgba(0,0,0,.92), rgba(0,0,0,0)); }
  .pl-controls { transition: opacity .22s ease; }
  .ctrl-hide { opacity: 0 !important; pointer-events: none !important; }

  input[type=range].vol { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 99px; background: #3a3a44; outline: none; }
  input[type=range].vol::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; cursor: pointer; }
  input[type=range].vol::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: #fff; cursor: pointer; }

  .fade-in { animation: fadeIn .22s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .sheet-in { animation: sheetIn .26s cubic-bezier(.22,1,.36,1) both; }
  @keyframes sheetIn { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
  .pop-in { animation: popIn .18s cubic-bezier(.22,1,.36,1) both; }
  @keyframes popIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
  .backdrop-in { animation: backdropIn .22s ease both; }
  @keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }

  .gesture-layer { touch-action: none; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>

<script>
/* ==========================================================================
   PLAYORA — local-first video player
   ========================================================================== */
'use strict';

/* ------------------------------- helpers -------------------------------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const fmtTime = (sec) => {
  if (!isFinite(sec) || sec < 0) sec = 0;
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
           : `${m}:${String(s).padStart(2,'0')}`;
};

const fmtSize = (b) => {
  if (!b || b < 0) return '';
  const u = ['B','KB','MB','GB','TB'];
  let i = 0, n = b;
  while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return (n >= 10 || i === 0 ? Math.round(n) : n.toFixed(1)) + ' ' + u[i];
};

const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
const relDate = (ts) => {
  if (!ts) return '';
  const d = new Date(ts), now = new Date();
  const diff = Math.round((startOfDay(now) - startOfDay(d)) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  if (diff < 7) return diff + ' days ago';
  return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' });
};
const relTime = (ts) => {
  if (!ts) return '';
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return relDate(ts);
};

const cleanName = (filename) => {
  let n = String(filename || 'Untitled').replace(/\.[^.]+$/, '');
  n = n.replace(/[._]+/g, ' ').replace(/\s+/g, ' ').trim();
  return n || 'Untitled';
};

const VIDEO_EXT = /\.(mp4|webm|mov|m4v|mkv|avi|ogv|ogg|3gp|flv|wmv)$/i;
const isVideoFile = (f) => f && (VIDEO_EXT.test(f.name || '') || (f.type || '').startsWith('video/'));

function icons() {
  try { window.lucide && window.lucide.createIcons({ attrs: { 'stroke-width': 1.8 } }); } catch (_) {}
}

/* ------------------------------- IndexedDB ------------------------------ */
const DB_NAME = 'playora';
const DB_VER = 1;
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains('videos'))     d.createObjectStore('videos', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('files'))      d.createObjectStore('files', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('playlists'))  d.createObjectStore('playlists', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('history'))    d.createObjectStore('history', { keyPath: 'videoId' });
      if (!d.objectStoreNames.contains('favorites'))  d.createObjectStore('favorites', { keyPath: 'videoId' });
      if (!d.objectStoreNames.contains('thumbnails')) d.createObjectStore('thumbnails', { keyPath: 'videoId' });
    };
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onerror = () => reject(req.error);
    req.onblocked = () => reject(new Error('Database blocked'));
  });
}

const idbReq = (req) => new Promise((res, rej) => {
  req.onsuccess = () => res(req.result);
  req.onerror = () => rej(req.error);
});
const store = (name, mode = 'readonly') => db.transaction(name, mode).objectStore(name);
const dbGet   = (s, k) => idbReq(store(s).get(k));
const dbAll   = (s)    => idbReq(store(s).getAll());
const dbPut   = (s, v) => idbReq(store(s, 'readwrite').put(v));
const dbDel   = (s, k) => idbReq(store(s, 'readwrite').delete(k));
const dbClear = (s)    => idbReq(store(s, 'readwrite').clear());

/* ------------------------------- settings ------------------------------- */
const SETTINGS_KEY = 'playora.settings.v1';
const DEFAULT_SETTINGS = {
  theme: 'dark',
  defaultSpeed: 1,
  autoResume: true,
  rememberPosition: true,
  autoHideControls: true,
  doubleTapSeek: true,
  skipInterval: 10,
  keepAwake: false,
  defaultLayout: 'grid',
  defaultSort: 'added-desc',
  confirmRemove: true
};

const state = {
  videos: [], playlists: [], history: [], favorites: [],
  videoMap: new Map(), histMap: new Map(), favMap: new Map(), thumbs: new Map(),
  settings: { ...DEFAULT_SETTINGS }
};

const libState = { search: '', sort: 'added-desc', layout: 'grid', filter: 'all' };
const favState = { search: '' };

function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (raw) state.settings = { ...DEFAULT_SETTINGS, ...JSON.parse(raw) };
  } catch (_) {}
  libState.layout = state.settings.defaultLayout;
  libState.sort = state.settings.defaultSort;
}
function saveSettings() {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(state.settings)); } catch (_) {}
}

/* --------------------------------- themes -------------------------------- */
const THEMES = {
  dark: {
    label: 'Dark',
    bg: [8, 8, 11], surface: [14, 14, 18], panel: [20, 20, 25],
    line: [36, 36, 44], muted: [138, 138, 151], elev: [21, 21, 26],
    accent: [124, 107, 255], accent2: [154, 140, 255]
  },
  midnight: {
    label: 'Midnight',
    bg: [6, 10, 20], surface: [10, 16, 28], panel: [14, 22, 38],
    line: [30, 44, 66], muted: [130, 148, 175], elev: [16, 25, 42],
    accent: [56, 189, 248], accent2: [125, 211, 252]
  },
  neon: {
    label: 'Neon',
    bg: [10, 6, 18], surface: [16, 10, 28], panel: [22, 14, 38],
    line: [48, 30, 72], muted: [160, 140, 180], elev: [26, 16, 44],
    accent: [255, 46, 136], accent2: [255, 122, 176]
  },
  lime: {
    label: 'Lime',
    bg: [6, 12, 6], surface: [10, 18, 10], panel: [14, 26, 14],
    line: [34, 56, 34], muted: [140, 170, 140], elev: [18, 34, 18],
    accent: [163, 230, 53], accent2: [190, 242, 100]
  },
  forest: {
    label: 'Forest',
    bg: [5, 14, 10], surface: [9, 20, 15], panel: [13, 28, 21],
    line: [28, 52, 40], muted: [140, 165, 150], elev: [16, 34, 26],
    accent: [34, 197, 94], accent2: [74, 222, 128]
  },
  sunset: {
    label: 'Sunset',
    bg: [14, 8, 8], surface: [20, 12, 11], panel: [28, 16, 14],
    line: [58, 34, 30], muted: [175, 145, 135], elev: [34, 19, 17],
    accent: [249, 115, 22], accent2: [251, 146, 60]
  },
  rose: {
    label: 'Rose',
    bg: [14, 8, 12], surface: [20, 12, 18], panel: [28, 16, 25],
    line: [58, 34, 50], muted: [175, 140, 160], elev: [34, 19, 30],
    accent: [244, 63, 94], accent2: [251, 113, 133]
  },
  amethyst: {
    label: 'Amethyst',
    bg: [10, 6, 16], surface: [16, 10, 24], panel: [22, 14, 33],
    line: [50, 34, 70], muted: [165, 145, 185], elev: [28, 18, 42],
    accent: [168, 85, 247], accent2: [192, 132, 252]
  }
};

const rgbStr = (arr) => arr.join(' ');
const hexStr = (arr) => '#' + arr.map(n => n.toString(16).padStart(2, '0')).join('');

function applyTheme(key) {
  const t = THEMES[key] || THEMES.dark;
  state.settings.theme = THEMES[key] ? key : 'dark';
  const root = document.documentElement.style;
  root.setProperty('--c-bg',      rgbStr(t.bg));
  root.setProperty('--c-surface', rgbStr(t.surface));
  root.setProperty('--c-panel',   rgbStr(t.panel));
  root.setProperty('--c-line',    rgbStr(t.line));
  root.setProperty('--c-muted',   rgbStr(t.muted));
  root.setProperty('--c-elev',    rgbStr(t.elev));
  root.setProperty('--c-accent',  rgbStr(t.accent));
  root.setProperty('--c-accent2', rgbStr(t.accent2));
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', hexStr(t.bg));
}

function themePickerHTML() {
  const t = THEMES[state.settings.theme] || THEMES.dark;
  return `
    <button data-action="open-theme-modal" class="w-full flex items-center gap-3 py-3.5 text-left">
      <div class="w-8 h-8 rounded-lg bg-white/[0.04] border border-line/60 grid place-items-center shrink-0">
        <i data-lucide="palette" class="w-4 h-4 text-white/45"></i>
      </div>
      <div class="min-w-0 flex-1">
        <p class="text-[13.5px] font-medium">Theme</p>
        <p class="text-[11.5px] text-muted mt-0.5">Pick a colour mood for the app</p>
      </div>
      <span class="flex items-center gap-2 text-[12px]">
        <span id="theme-row-swatch" class="w-4 h-4 rounded-full ring-1 ring-white/20"
              style="background:linear-gradient(135deg, rgb(${t.accent.join(',')}), rgb(${t.accent2.join(',')}))"></span>
        <span id="theme-row-label" class="text-white/85 font-medium">${t.label}</span>
        <i data-lucide="chevron-right" class="w-4 h-4 text-white/25"></i>
      </span>
    </button>`;
}

function syncThemeRow() {
  const t = THEMES[state.settings.theme] || THEMES.dark;
  const swatch = $('#theme-row-swatch');
  const label  = $('#theme-row-label');
  if (swatch) swatch.style.background = `linear-gradient(135deg, rgb(${t.accent.join(',')}), rgb(${t.accent2.join(',')}))`;
  if (label)  label.textContent = t.label;
}

function openThemeModal() {
  const prevTheme = state.settings.theme;
  let escHandler = null;

  /* put everything back exactly as it was before the sheet opened */
  const revert = () => {
    if (state.settings.theme === prevTheme) return;
    applyTheme(prevTheme);
    saveSettings();
    syncThemeRow();
  };

  const cards = Object.entries(THEMES).map(([k, t]) => `
    <button data-theme-card="${k}"
      class="relative h-[92px] rounded-xl overflow-hidden ring-1 ring-white/[0.06] hover:ring-white/25 transition-all duration-200 active:scale-[0.97] text-left"
      style="background: rgb(${t.bg.join(',')})">
      <span class="absolute inset-0 pointer-events-none"
            style="background: radial-gradient(circle at 25% 0%, rgb(${t.accent.join(',')} / 0.28), transparent 70%)"></span>
      <span class="absolute inset-2 flex flex-col gap-1 pointer-events-none">
        <span class="flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full" style="background: rgb(${t.accent.join(',')})"></span>
          <span class="h-1 flex-1 rounded-full" style="background: rgb(${t.line.join(',')})"></span>
        </span>
        <span class="flex-1 rounded-md" style="background: rgb(${t.panel.join(',')}); border: 1px solid rgb(${t.line.join(',')})"></span>
        <span class="h-1 rounded-full w-3/5" style="background: rgb(${t.accent.join(',')})"></span>
      </span>
      <span class="absolute inset-x-2 bottom-1.5 flex items-center justify-between pointer-events-none">
        <span class="text-[10.5px] font-semibold text-white/90 drop-shadow">${t.label}</span>
        <span class="w-3 h-3 rounded-full ring-1 ring-white/25"
              style="background:linear-gradient(135deg, rgb(${t.accent.join(',')}), rgb(${t.accent2.join(',')}))"></span>
      </span>
    </button>`).join('');

  openModal({
    title: 'Choose a theme',
    body: `
      <div class="flex items-start gap-2.5 mb-3.5 px-0.5">
        <i data-lucide="info" class="w-3.5 h-3.5 text-accent mt-0.5 shrink-0"></i>
        <p class="text-[11.5px] leading-relaxed text-muted">
          Tap a theme to preview it live. Press
          <span class="text-white/85 font-semibold">Done</span> to keep it,
          or <span class="text-white/85 font-semibold">✕</span> to cancel and keep your previous theme.
        </p>
      </div>
      <div class="grid grid-cols-2 gap-2.5">${cards}</div>`,
    footer: `<button data-done
      class="w-full h-11 rounded-xl bg-accent hover:bg-accent2 active:scale-[0.99] transition text-[13.5px] font-semibold text-white">
      Done
    </button>`,
    onMount(root, done) {
      /* Esc = cancel, same as ✕ */
      escHandler = (e) => { if (e.key === 'Escape') done(null); };
      document.addEventListener('keydown', escHandler);

      /* Done = commit — keeps the currently previewed theme */
      root.querySelector('[data-done]').addEventListener('click', () => done(true));

      root.querySelectorAll('[data-theme-card]').forEach(btn => {
        btn.addEventListener('click', () => {
          const key = btn.dataset.themeCard;

          /* clicking the already-active theme = no change, do nothing */
          if (state.settings.theme === key) return;

          /* live preview only — sheet stays open, Done is required to keep */
          applyTheme(key);
          saveSettings();
          syncThemeRow();

          /* highlight the selected card */
          root.querySelectorAll('[data-theme-card]').forEach(b => {
            const sel = b === btn;
            b.style.outline = sel ? '2px solid rgb(var(--c-accent))' : '';
            b.style.outlineOffset = sel ? '2px' : '';
          });
        });
      });
    }
  }).then((result) => {
    if (escHandler) { document.removeEventListener('keydown', escHandler); escHandler = null; }
    /* result === true → user pressed Done → keep the previewed theme
       result !== true → ✕ / backdrop / Esc → restore the previous theme */
    if (result !== true) revert();
  });
}

/* --------------------------------- data --------------------------------- */
async function loadAll() {
  const [videos, playlists, history, favorites, thumbs] = await Promise.all([
    dbAll('videos'), dbAll('playlists'), dbAll('history'), dbAll('favorites'), dbAll('thumbnails')
  ]);
  state.videos = videos.sort((a, b) => b.addedAt - a.addedAt);
  state.playlists = playlists.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  state.history = history;
  state.favorites = favorites;
  state.thumbs = new Map(thumbs.map(t => [t.videoId, t.dataUrl]));
  rebuildMaps();
}
function rebuildMaps() {
  state.videoMap = new Map(state.videos.map(v => [v.id, v]));
  state.histMap = new Map(state.history.map(h => [h.videoId, h]));
  state.favMap = new Map(state.favorites.map(f => [f.videoId, f]));
}

/* --------------------------------- toast -------------------------------- */
function toast(message, type = 'default', ms = 2800) {
  const root = $('#toasts');
  const node = document.createElement('div');
  const tone = type === 'error' ? 'border-red-500/30 bg-red-500/10 text-red-200'
             : type === 'success' ? 'border-emerald-500/30 bg-emerald-500/10 text-emerald-200'
             : 'border-line bg-panel text-white/90';
  node.className = `pointer-events-auto flex items-start gap-2.5 rounded-xl border ${tone} px-3.5 py-3 text-[13px] shadow-2xl shadow-black/50 backdrop-blur-xl fade-in`;
  node.innerHTML = `

/* ------------------------------ media utils ----------------------------- */
function probeVideo(url) {
  return new Promise((resolve) => {
    const v = document.createElement('video');
    let settled = false;
    const finish = (val) => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      v.removeAttribute('src');
      try { v.load(); } catch (_) {}
      resolve(val);
    };
    const timer = setTimeout(() => finish(null), 12000);
    v.preload = 'metadata';
    v.muted = true;
    v.playsInline = true;
    v.onloadedmetadata = () => finish({
      duration: isFinite(v.duration) ? v.duration : 0,
      width: v.videoWidth || 0,
      height: v.videoHeight || 0
    });
    v.onerror = () => finish(null);
    v.src = url;
  });
}

function captureThumb(url, duration) {
  return new Promise((resolve) => {
    const v = document.createElement('video');
    let settled = false;
    const finish = (val) => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      v.removeAttribute('src');
      try { v.load(); } catch (_) {}
      resolve(val);
    };
    const timer = setTimeout(() => finish(null), 15000);
    v.preload = 'auto';
    v.muted = true;
    v.playsInline = true;
    v.onerror = () => finish(null);
    v.onloadeddata = () => {
      const target = duration > 1 ? clamp(duration * 0.1, 0.4, Math.max(duration - 0.4, 0.4)) : 0;
      const grab = () => {
        try {
          const vw = v.videoWidth || 640, vh = v.videoHeight || 360;
          const w = 480;
          const h = Math.max(1, Math.round(w * (vh / vw)));
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          const ctx = c.getContext('2d');
          if (!ctx) return finish(null);
          ctx.drawImage(v, 0, 0, w, h);
          finish(c.toDataURL('image/jpeg', 0.72));
        } catch (_) { finish(null); }
      };
      if (target <= 0.02) return grab();
      v.addEventListener('seeked', grab, { once: true });
      try { v.currentTime = target; } catch (_) { finish(null); }
    };
    v.src = url;
  });
}

/* ------------------------------ import flow ----------------------------- */
function ensureStoragePersisted() {
  try {
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch (_) {}
}

async function importFileRecord(file, handle = null) {
  const id = uid('v_');
  const url = URL.createObjectURL(file);
  const meta = await probeVideo(url);
  const thumb = await captureThumb(url, meta ? meta.duration : 0).catch(() => null);
  URL.revokeObjectURL(url);

  const rec = {
    id,
    name: cleanName(file.name),
    originalName: file.name,
    size: file.size || 0,
    type: file.type || '',
    duration: meta ? meta.duration : 0,
    width: meta ? meta.width : 0,
    height: meta ? meta.height : 0,
    addedAt: Date.now(),
    lastPlayedAt: 0,
    storage: handle ? 'handle' : 'blob',
    handle: handle || null
  };

  if (!handle) {
    try {
      await dbPut('files', { id, blob: file });
    } catch (err) {
      throw new Error('storage');
    }
  }
  await dbPut('videos', rec);
  if (thumb) await dbPut('thumbnails', { videoId: id, dataUrl: thumb });
  return rec;
}

function importBar() {
  let bar = $('#import-bar');
  if (bar) return bar;
  bar = document.createElement('div');
  bar.id = 'import-bar';
  bar.className = 'fixed z-[115] left-3 right-3 md:left-auto md:right-6 md:w-[320px] bottom-[calc(88px+env(safe-area-inset-bottom))] md:bottom-6 rounded-xl border border-line bg-panel px-4 py-3 shadow-2xl shadow-black/60 fade-in';
  bar.innerHTML = `
    <div class="flex items-center gap-2 mb-2">
      <i data-lucide="loader-2" class="w-3.5 h-3.5 text-accent animate-spin"></i>
      <p class="text-[12.5px] font-medium flex-1" data-bar-label>Importing…</p>
      <span class="text-[11.5px] text-muted" data-bar-count></span>
    </div>
    <div class="h-1 rounded-full bg-line overflow-hidden">
      <div class="h-full bg-accent rounded-full transition-all duration-300" style="width:0%" data-bar-fill></div>
    </div>`;
  document.body.appendChild(bar);
  icons();
  return bar;
}
function updateImportBar(done, total, label) {
  const bar = importBar();
  const fill = bar.querySelector('[data-bar-fill]');
  const pct = total ? Math.round((done / total) * 100) : 0;
  fill.style.width = pct + '%';
  bar.querySelector('[data-bar-count]').textContent = `${done}/${total}`;
  if (label) bar.querySelector('[data-bar-label]').textContent = label;
}
function hideImportBar() {
  const bar = $('#import-bar');
  if (bar) bar.remove();
}

async function importFromHandleList(handles) {
  if (!handles || !handles.length) return;
  ensureStoragePersisted();
  importBar();
  let ok = 0, failed = 0;
  for (let i = 0; i < handles.length; i++) {
    const h = handles[i];
    updateImportBar(i, handles.length, 'Importing ' + (h.name || 'video'));
    try {
      const file = await h.getFile();
      if (!isVideoFile(file)) { failed++; continue; }
      await importFileRecord(file, h);
      ok++;
    } catch (err) {
      failed++;
      console.warn('Import failed', err);
    }
    updateImportBar(i + 1, handles.length);
  }
  hideImportBar();
  await loadAll();
  finishImport(ok, failed);
}

async function importFromFiles(fileList) {
  const files = Array.from(fileList || []).filter(isVideoFile);
  if (!files.length) { toast('No supported video files selected', 'error'); return; }
  ensureStoragePersisted();
  importBar();
  let ok = 0, failed = 0, quota = false;
  for (let i = 0; i < files.length; i++) {
    updateImportBar(i, files.length, 'Importing ' + files[i].name);
    try {
      await importFileRecord(files[i], null);
      ok++;
    } catch (err) {
      failed++;
      if (err && err.message === 'storage') quota = true;
      console.warn('Import failed', err);
    }
    updateImportBar(i + 1, files.length);
  }
  hideImportBar();
  await loadAll();
  if (quota) toast('Browser storage is full — some videos could not be saved', 'error', 5000);
  finishImport(ok, failed);
}

function finishImport(ok, failed) {
  if (ok > 0) toast(`${ok} video${ok > 1 ? 's' : ''} added to your library`, 'success');
  if (failed > 0 && ok === 0) toast('Could not import the selected file(s)', 'error');
  else if (failed > 0) toast(`${failed} file${failed > 1 ? 's' : ''} could not be imported`, 'error');
  refreshRoute();
}

async function pickAndImport() {
  if (window.showOpenFilePicker && window.isSecureContext) {
    try {
      const handles = await window.showOpenFilePicker({
        multiple: true,
        types: [{
          description: 'Videos',
          accept: { 'video/*': ['.mp4', '.webm', '.mov', '.m4v', '.mkv', '.avi', '.ogv'] }
        }]
      });
      await importFromHandleList(handles);
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return;
      /* fall through to classic input */
    }
  }
  $('#file-input').click();
}

/* -------------------------- video source resolve ------------------------ */
async function resolveVideoSource(rec) {
  if (!rec) return null;
  if (rec.storage === 'blob') {
    const row = await dbGet('files', rec.id);
    return row && row.blob ? row.blob : null;
  }
  if (rec.storage === 'handle' && rec.handle) {
    try {
      const h = rec.handle;
      if (typeof h.queryPermission === 'function') {
        let p = await h.queryPermission({ mode: 'read' });
        if (p !== 'granted' && typeof h.requestPermission === 'function') {
          p = await h.requestPermission({ mode: 'read' });
        }
        if (p !== 'granted') return null;
      }
      return await h.getFile();
    } catch (_) { return null; }
  }
  return null;
}

    .map(h => state.videoMap.get(h.videoId))
    .filter(Boolean);

  const spotlight = continueList[0] || state.videos[0];
  const spotlightHist = spotlight ? state.histMap.get(spotlight.id) : null;
  const spotlightPct = spotlightHist && spotlightHist.duration
    ? clamp((spotlightHist.position / spotlightHist.duration) * 100, 0, 100) : 0;
  const spotlightLeft = spotlightHist && spotlightHist.duration
    ? Math.max(0, spotlightHist.duration - spotlightHist.position)
    : (spotlight ? spotlight.duration : 0);
  const canResume = !!(spotlightHist && !spotlightHist.completed && spotlightHist.position > 3);

  const recent = state.videos.filter(v => v.id !== (spotlight && spotlight.id)).slice(0, 12);
  const favs = state.favorites
    .slice()
    .sort((a, b) => b.addedAt - a.addedAt)
    .map(f => state.videoMap.get(f.videoId))
    .filter(Boolean)
    .slice(0, 12);

  const greeting = (() => {
    const h = new Date().getHours();
    if (h < 5)  return 'Late night watching';
    if (h < 12) return 'Good morning';
    if (h < 18) return 'Good afternoon';
    return 'Good evening';
  })();

  const totalWatchSec = state.history.reduce((sum, h) => sum + (h.position || 0), 0);
  const watchTimeStr = (() => {
    if (totalWatchSec < 60) return '0m';
    const h = Math.floor(totalWatchSec / 3600);
    const m = Math.floor((totalWatchSec % 3600) / 60);
    if (h >= 24) return Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
    if (h > 0) return h + 'h' + (m ? ' ' + m + 'm' : '');
    return m + 'm';
  })();

  const cardW = 'w-[168px] sm:w-[196px] md:w-[228px] shrink-0 snap-start';

  let html = header + '<div class="pt-3 md:pt-5 pb-8 space-y-8 md:space-y-10 fade-in">';

  /* ---------- GREETING + STATS ---------- */
  html += `
    <section class="px-4 md:px-8">
      <h1 class="text-[22px] md:text-[28px] font-semibold tracking-tight leading-tight">${greeting}.</h1>
      <p class="text-[12.5px] md:text-[13px] text-muted mt-1">Ready to pick up where you left off?</p>
      <div class="grid grid-cols-3 gap-2 md:gap-3 mt-4">
        <div class="rounded-xl border border-line bg-panel px-3 py-2.5 md:px-4 md:py-3">
          <div class="flex items-center gap-1.5 text-muted mb-1">
            <i data-lucide="film" class="w-3 h-3 md:w-3.5 md:h-3.5"></i>
            <span class="text-[9.5px] md:text-[10px] uppercase tracking-wider font-semibold">Videos</span>
          </div>
          <p class="text-[16px] md:text-[19px] font-semibold tabular-nums leading-none">${total}</p>
        </div>
        <div class="rounded-xl border border-line bg-panel px-3 py-2.5 md:px-4 md:py-3">
          <div class="flex items-center gap-1.5 text-muted mb-1">
            <i data-lucide="clock" class="w-3 h-3 md:w-3.5 md:h-3.5"></i>
            <span class="text-[9.5px] md:text-[10px] uppercase tracking-wider font-semibold">Watched</span>
          </div>
          <p class="text-[16px] md:text-[19px] font-semibold tabular-nums leading-none">${watchTimeStr}</p>
        </div>
        <div class="rounded-xl border border-line bg-panel px-3 py-2.5 md:px-4 md:py-3">
          <div class="flex items-center gap-1.5 text-muted mb-1">
            <i data-lucide="heart" class="w-3 h-3 md:w-3.5 md:h-3.5"></i>
            <span class="text-[9.5px] md:text-[10px] uppercase tracking-wider font-semibold">Favorites</span>
          </div>
          <p class="text-[16px] md:text-[19px] font-semibold tabular-nums leading-none">${state.favorites.length}</p>
        </div>
      </div>
    </section>`;

  /* ---------- SPOTLIGHT ---------- */
  if (spotlight) {
    html += `
      <section class="px-4 md:px-8">
        <div class="relative aspect-[16/10] sm:aspect-[16/9] md:aspect-[3/1] rounded-2xl overflow-hidden bg-[#15151a] ring-1 ring-white/[0.05] cursor-pointer"
             data-action="play" data-id="${spotlight.id}">
          ${thumbHTML(spotlight)}
          <div class="absolute inset-0 bg-gradient-to-t from-black via-black/55 to-black/5 pointer-events-none"></div>
          <div class="absolute inset-x-0 bottom-0 p-4 md:p-6 z-10">
            <div class="flex items-center gap-2 mb-2">
              ${canResume
                ? `<span class="px-2 py-[3px] rounded-md bg-accent text-[9.5px] font-bold uppercase tracking-wider text-white">Continue</span>`
                : `<span class="px-2 py-[3px] rounded-md bg-white/15 backdrop-blur border border-white/20 text-[9.5px] font-bold uppercase tracking-wider text-white/90">Featured</span>`}
              <span class="text-[10.5px] text-white/65 tabular-nums">
                ${canResume ? fmtTime(spotlightLeft) + ' left' : fmtTime(spotlight.duration)}
              </span>
              ${spotlight.size ? `<span class="text-[10.5px] text-white/40">·</span><span class="text-[10.5px] text-white/65">${fmtSize(spotlight.size)}</span>` : ''}
            </div>
            <h2 class="text-[18px] md:text-[24px] font-semibold leading-tight max-w-2xl line-clamp-2 text-white drop-shadow-lg">${esc(spotlight.name)}</h2>
            <div class="mt-3 flex items-center gap-3 max-w-xl">
              <div class="flex-1 h-1 rounded-full bg-white/15 overflow-hidden">
                <div class="h-full bg-accent rounded-full transition-all" style="width:${spotlightPct}%"></div>
              </div>
              <span class="text-[11px] text-white/70 tabular-nums shrink-0">${Math.round(spotlightPct)}%</span>
            </div>
            <div class="mt-4 flex items-center gap-2">
              <button data-action="play" data-id="${spotlight.id}"
                class="h-10 md:h-11 px-4 md:px-6 rounded-xl bg-white text-black text-[13px] font-semibold hover:bg-white/90 active:scale-[0.98] transition flex items-center gap-2 shadow-lg">
                <i data-lucide="play" class="w-4 h-4 fill-black translate-x-[1px]"></i>
                ${canResume ? 'Resume' : 'Play'}
              </button>
              <button data-action="vmenu" data-id="${spotlight.id}"
                class="h-10 md:h-11 w-10 md:w-11 rounded-xl bg-white/12 backdrop-blur border border-white/20 text-white hover:bg-white/20 transition grid place-items-center">
                <i data-lucide="more-vertical" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        </div>
      </section>`;
  }

  /* ---------- CONTINUE WATCHING (excludes spotlight) ---------- */
  if (continueList.length > 1) {
    html += `
      <section>
        <div class="px-4 md:px-8">${sectionHeader('Continue watching', 'See all', 'data-action="go" data-href="#/history"')}</div>
        ${hScroller(continueList.slice(1).map(v => {
          const h = state.histMap.get(v.id);
          const pct = h ? clamp((h.position / h.duration) * 100, 0, 100) : 0;
          const left = h ? Math.max(0, h.duration - h.position) : 0;
          return `
            <div class="${cardW} group">
              <div class="relative aspect-video rounded-xl overflow-hidden bg-[#15151a] cursor-pointer ring-1 ring-white/[0.04]" data-action="play" data-id="${v.id}">
                ${thumbHTML(v)}
                <div class="absolute inset-0 grid place-items-center">
                  <span class="w-11 h-11 rounded-full bg-black/55 backdrop-blur grid place-items-center">
                    <i data-lucide="play" class="w-5 h-5 text-white fill-white translate-x-[1px]"></i>
                  </span>
                </div>
                <span class="absolute bottom-1.5 right-1.5 px-1.5 py-[2px] rounded-md bg-black/80 text-[10.5px] font-medium tabular-nums">${fmtTime(left)} left</span>
                <div class="absolute left-0 right-0 bottom-0 h-[3px] bg-white/25"><div class="h-full bg-accent" style="width:${pct}%"></div></div>
              </div>
              <p class="mt-2 text-[12.5px] font-medium leading-snug line-clamp-1 cursor-pointer" data-action="play" data-id="${v.id}">${esc(v.name)}</p>
              <p class="text-[10.5px] text-muted mt-0.5">${Math.round(pct)}% · ${esc(relTime(h.lastWatchedAt))}</p>
            </div>`;
        }).join(''))}
      </section>`;
  }

  /* ---------- RECENTLY ADDED ---------- */
  if (recent.length) {
    html += `
      <section>
        <div class="px-4 md:px-8">${sectionHeader('Recently added', 'See all', 'data-action="go" data-href="#/library"')}</div>
        ${hScroller(recent.map(v => `<div class="${cardW}">${videoCardGrid(v)}</div>`).join(''))}
      </section>`;
  }

  /* ---------- FAVORITES ---------- */
  if (favs.length) {
    html += `
      <section>
        <div class="px-4 md:px-8">${sectionHeader('Favorites', 'See all', 'data-action="go" data-href="#/favorites"')}</div>
        ${hScroller(favs.map(v => `<div class="${cardW}">${videoCardGrid(v)}</div>`).join(''))}
      </section>`;
  }

  /* ---------- QUICK IMPORT ---------- */
  html += `
    <section class="px-4 md:px-8">
      <div class="rounded-2xl border border-line bg-panel p-4 md:p-5 flex items-center gap-4">
        <div class="w-11 h-11 rounded-xl bg-accent/12 border border-accent/20 grid place-items-center shrink-0">
          <i data-lucide="plus" class="w-5 h-5 text-accent"></i>
        </div>
        <div class="min-w-0 flex-1">
          <p class="text-[13.5px] font-semibold">Quick import</p>
          <p class="text-[11.5px] text-muted mt-0.5">Add more videos from this device</p>
        </div>
        <button data-action="import"
          class="h-10 px-4 rounded-lg bg-accent hover:bg-accent2 active:scale-[0.98] transition text-[13px] font-semibold text-white shrink-0">
          Import
        </button>
      </div>
    </section>

    <div class="px-4 md:px-8 pt-2 text-center md:text-left">
      <p class="text-[10.5px] text-muted/50">Developed By ~ Shankar Prasad Pyke</p>
    </div>`;

  html += '</div>';
  return html;
}

/* ------------------------------- LIBRARY -------------------------------- */
function sortedVideos(list, sort) {
  const arr = list.slice();
  switch (sort) {
    case 'name-asc':  return arr.sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
    case 'name-desc': return arr.sort((a, b) => b.name.localeCompare(a.name, undefined, { sensitivity: 'base' }));
    case 'dur-asc':   return arr.sort((a, b) => (a.duration || 0) - (b.duration || 0));
    case 'dur-desc':  return arr.sort((a, b) => (b.duration || 0) - (a.duration || 0));
    case 'played':    return arr.sort((a, b) => {
      const av = state.histMap.get(a.id)?.lastWatchedAt || a.lastPlayedAt || 0;
      const bv = state.histMap.get(b.id)?.lastWatchedAt || b.lastPlayedAt || 0;
      return bv - av;
    });
    default:          return arr.sort((a, b) => b.addedAt - a.addedAt);
  }
}

const LIB_FILTERS = [
  { key: 'all',       label: 'All',         icon: 'layout-grid' },
  { key: 'unwatched', label: 'Unwatched',   icon: 'circle' },
  { key: 'progress',  label: 'In progress', icon: 'circle-play' },
  { key: 'watched',   label: 'Watched',     icon: 'check-circle-2' },
  { key: 'favorites', label: 'Favorites',   icon: 'heart' }
];

const LIB_SORTS = [
  { key: 'added-desc', label: 'Recently added',  short: 'Recent', icon: 'clock' },
  { key: 'name-asc',   label: 'Name A–Z',        short: 'A–Z',    icon: 'arrow-down-a-z' },
  { key: 'name-desc',  label: 'Name Z–A',        short: 'Z–A',    icon: 'arrow-up-a-z' },
  { key: 'dur-asc',    label: 'Shortest first',  short: 'Short',  icon: 'arrow-down-wide-narrow' },
  { key: 'dur-desc',   label: 'Longest first',   short: 'Long',   icon: 'arrow-up-narrow-wide' },
  { key: 'played',     label: 'Recently played', short: 'Played', icon: 'history' }
];

function matchesLibFilter(v, filter) {
  const h = state.histMap.get(v.id);
  switch (filter) {
    case 'unwatched': return !h || (h.position || 0) < 3;
    case 'progress':  return h && !h.completed && (h.position || 0) > 3;
    case 'watched':   return h && h.completed;
    case 'favorites': return state.favMap.has(v.id);
    default:          return true;
  }
}

function libChipClass(on) {
  return [
    'shrink-0 h-8 px-3 rounded-full text-[12px] transition active:scale-95',
    'flex items-center gap-1.5',
    on
      ? 'bg-accent text-white font-semibold'
      : 'border border-line bg-surface text-white/70 font-medium hover:text-white hover:bg-white/[0.06]'
  ].join(' ');
}

function libChipHTML(f) {
  const on = libState.filter === f.key;
  return `<button data-action="lib-filter" data-key="${f.key}" class="${libChipClass(on)}" aria-pressed="${on}">
    <i data-lucide="${f.icon}" class="w-3.5 h-3.5 ${on ? '' : 'opacity-70'}"></i>
    <span>${esc(f.label)}</span>
  </button>`;
}

function renderSortButton() {
  const btn = $('#lib-sort-btn');
  if (!btn) return;
  const opt = LIB_SORTS.find(s => s.key === libState.sort) || LIB_SORTS[0];
  btn.innerHTML = `
    <i data-lucide="${opt.icon}" class="w-3.5 h-3.5 text-white/55"></i>
    <span class="hidden sm:inline">${esc(opt.short)}</span>
    <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-white/40"></i>`;
  btn.setAttribute('title', 'Sort: ' + opt.label);
  icons();
}

function libSubtitleText() {
  const total = state.videos.length;
  if (total === 0) return 'Empty';
  const list = filteredVideos(libState.search, libState.sort, libState.filter);
  const isFiltering = !!libState.search.trim() || libState.filter !== 'all';
  if (isFiltering) return `${list.length} of ${total} shown`;
  const progress = state.history.filter(h => !h.completed && (h.position || 0) > 3).length;
  return `${total} video${total === 1 ? '' : 's'}${progress ? ' · ' + progress + ' in progress' : ''}`;
}

function filteredVideos(search, sort, filter = 'all') {
  const q = search.trim().toLowerCase();
  let base = state.videos;
  if (q) base = base.filter(v => v.name.toLowerCase().includes(q));
  if (filter && filter !== 'all') base = base.filter(v => matchesLibFilter(v, filter));
  return sortedVideos(base, sort);
}

  const header = `

                <i data-lucide="${sortOpt.icon}" class="w-3.5 h-3.5 text-white/55"></i>

function renderLibraryBody() {
  const host = $('#lib-body');
  if (!host) return;

  // Keep subtitle in sync
  const subtitle = $('#lib-subtitle');
  if (subtitle) subtitle.textContent = libSubtitleText();

  /* ---------- Truly empty library ---------- */
  if (state.videos.length === 0) {
    host.innerHTML = `
      <div class="flex flex-col items-center text-center py-16">
        <div class="relative w-20 h-20 rounded-3xl border border-line bg-panel grid place-items-center mb-5">
          <div class="absolute inset-0 rounded-3xl bg-accent/12 blur-2xl -z-10"></div>
          <i data-lucide="clapperboard" class="w-8 h-8 text-white/25"></i>
        </div>
        <h3 class="text-[16px] font-semibold">Your library is waiting.</h3>
        <p class="mt-1.5 text-[12.5px] text-muted max-w-[240px]">Add videos from your device and start watching.</p>
        <button data-action="import" class="mt-6 h-11 px-5 rounded-xl bg-accent hover:bg-accent2 transition text-[13.5px] font-semibold text-white flex items-center gap-2">
          <i data-lucide="plus" class="w-4 h-4"></i> Import Videos
        </button>
      </div>`;
    icons();
    return;
  }

  const list = filteredVideos(libState.search, libState.sort, libState.filter);

  /* ---------- Filter/search yields nothing ---------- */
  if (!list.length) {
    const hasSearch = !!libState.search.trim();
    const hasFilter = libState.filter !== 'all';
    let msg = 'No videos match your search';
    if (hasSearch && hasFilter) msg = `No videos match “${esc(libState.search)}” in this filter`;
    else if (hasFilter)         msg = 'No videos in this filter yet';
    else if (hasSearch)         msg = `No videos match “${esc(libState.search)}”`;

    host.innerHTML = `
      <div class="py-16 text-center">
        <div class="w-16 h-16 rounded-2xl border border-line bg-panel grid place-items-center mx-auto mb-4">
          <i data-lucide="search-x" class="w-6 h-6 text-white/25"></i>
        </div>
        <p class="text-[13.5px] font-medium px-4">${msg}</p>
        <p class="text-[12px] text-muted mt-1">Try adjusting your search or filters.</p>
        <button data-action="lib-clear"
          class="mt-5 h-10 px-4 rounded-lg border border-line text-[12.5px] font-medium text-white/80 hover:bg-white/[0.05] transition">
          Clear filters
        </button>
      </div>`;
    icons();
    return;
  }

  /* ---------- Render list ---------- */
  if (libState.layout === 'grid') {
    host.innerHTML = `<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-x-3 gap-y-6 md:gap-x-5 md:gap-y-8">
      ${list.map(videoCardGrid).join('')}
    </div>`;
  } else {
    host.innerHTML = `<div class="space-y-1">${list.map(videoRow).join('')}</div>`;
  }
  icons();
}

/* ------------------------------ PLAYER ---------------------------------- */
const Player = {
  root: null,
  video: null,
  rec: null,
  objectUrl: null,
  token: 0,
  isOpen: false,
  locked: false,
  returnTo: '#/library',
  playlist: null,
  index: -1,
  brightness: 1,
  speed: 1,
  repeat: false,
  aspect: 'contain',
  hideTimer: null,
  saveTimer: null,
  lastSaveAt: 0,
  sleepTimerId: null,
  sleepTimeout: null,
  subtitleUrl: null,
  wakeLock: null,
  _videoId: null,
  _nextInterval: null,
  _nextTimeout: null,
  rotation: 0,
  _resizeHandler: null,
  _carryLock: false,

  close() {
    this.token++;
    if (this.video) {
      try { this.video.pause(); } catch (_) {}
      try { this.video.removeAttribute('src'); this.video.load(); } catch (_) {}
    }
    if (this.objectUrl) { URL.revokeObjectURL(this.objectUrl); this.objectUrl = null; }
    if (this.subtitleUrl) { URL.revokeObjectURL(this.subtitleUrl); this.subtitleUrl = null; }
    clearTimeout(this.hideTimer);
    clearInterval(this.saveTimer);
    clearTimeout(this.sleepTimeout);
    this.clearNextCountdown();
    this.releaseWakeLock();
    this.rotation = 0;
    if (this._resizeHandler) {
      window.removeEventListener('resize', this._resizeHandler);
      window.removeEventListener('orientationchange', this._resizeHandler);
      this._resizeHandler = null;
    }
    this._carryLock = false;
    if (this.root) { this.root.classList.add('hidden'); this.root.innerHTML = ''; }
    this.isOpen = false;
    this.rec = null;
    this.video = null;
    this.playlist = null;
    this.index = -1;
    this.locked = false;
    this.brightness = 1;
    this._videoId = null;
  },

  async open(videoId, playlistId) {
    if (this.isOpen && this._videoId === videoId && this.video && !this.video.error) {
      try { await this.video.play(); } catch (_) {}
      return;
    }

    /* remember the carry flag before close() wipes it */
    const carryLock = !!this._carryLock;
    this._carryLock = false;

    this.close();
    const myToken = ++this.token;

    const rec = state.videoMap.get(videoId);
    if (!rec) { toast('Video not found in library', 'error'); go('#/library'); return; }

    this.root = $('#player-root');
    this.root.classList.remove('hidden');
    this.isOpen = true;
    this._videoId = videoId;
    this.rec = rec;

    /* playlist context */
    if (playlistId) {
      const pl = state.playlists.find(p => p.id === playlistId);
      if (pl) {
        this.playlist = pl;
        this.index = pl.videoIds.indexOf(videoId);
      }
    }

    this.root.innerHTML = `
      <div class="absolute inset-0 bg-black grid place-items-center" id="pl-loading">
        <div class="flex flex-col items-center gap-3">
          <div class="w-9 h-9 rounded-full border-2 border-white/15 border-t-accent animate-spin"></div>
          <p class="text-[12px] text-white/50">Loading video…</p>
        </div>
      </div>`;

    let file = null;
    try { file = await resolveVideoSource(rec); } catch (_) { file = null; }
    if (myToken !== this.token) return;

    if (!file) { this.renderError('This file is no longer accessible. Browser file access can be temporary — relink the file to keep watching.'); return; }

    this.objectUrl = URL.createObjectURL(file);

  relink() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'video/*,.mkv,.avi,.m4v,.mov,.mp4,.webm';
    input.onchange = async () => {
      const file = input.files && input.files[0];
      if (!file) return;
      try {
        await dbPut('files', { id: this.rec.id, blob: file });
        const updated = { ...this.rec, storage: 'blob', handle: null, size: file.size || this.rec.size, type: file.type || this.rec.type };
        if (!updated.duration) {
          const url = URL.createObjectURL(file);
          const meta = await probeVideo(url);
          if (meta) { updated.duration = meta.duration; updated.width = meta.width; updated.height = meta.height; }
          const thumb = await captureThumb(url, updated.duration).catch(() => null);
          URL.revokeObjectURL(url);
          if (thumb) await dbPut('thumbnails', { videoId: this.rec.id, dataUrl: thumb });
        }
        await dbPut('videos', updated);
        await loadAll();
        toast('File relinked', 'success');
        const id = updated.id;
        this.close();
        this.open(id, this.playlist ? this.playlist.id : null);
      } catch (err) {
        toast('Could not relink this file', 'error');
      }
    };
    input.click();

  attach() {
    const root = this.root;
    const video = $('#pl-video', root);
    this.video = video;
    video.src = this.objectUrl;

    /* apply initial aspect/rotation (aspect defaults to "contain", rotation 0) */
    this.applyVideoStyles();

    /* re-apply rotation geometry when the viewport or orientation changes */
    this._resizeHandler = () => {
      if (this.video && this.rotation) this.applyVideoStyles();
    };
    window.addEventListener('resize', this._resizeHandler);
    window.addEventListener('orientationchange', this._resizeHandler);

    /* -------- media events -------- */
    video.addEventListener('loadedmetadata', () => {
      $('#pl-dur', root).textContent = fmtTime(video.duration);
      this.applyResume();
      /* refit in case the user rotated before the video's intrinsic size was known */
      if (this.rotation !== 0) this.applyVideoStyles();
    });
    video.addEventListener('timeupdate', () => this.onTime());
    video.addEventListener('progress', () => this.onBuffer());
    video.addEventListener('play',  () => { this.syncPlayIcons(); this.scheduleHide(); this.acquireWakeLock(); this.startSaveLoop(); });
    video.addEventListener('pause', () => { this.syncPlayIcons(); this.showControls(); this.stopSaveLoop(); this.saveProgress(); this.releaseWakeLock(); });
    video.addEventListener('ended', () => this.onEnded());

      this.stopSaveLoop();
      this.renderError('This video could not be decoded by your browser.');
    });
    video.addEventListener('waiting', () => {
      const el = $('#pl-buffer', root);
      if (el) el.classList.remove('hidden');
    });
    video.addEventListener('playing', () => {
      const el = $('#pl-buffer', root);
      if (el) el.classList.add('hidden');
    });
    video.addEventListener('canplay', () => {
      const el = $('#pl-buffer', root);
      if (el) el.classList.add('hidden');
    });
    video.addEventListener('pause', () => {
      const el = $('#pl-buffer', root);
      if (el) el.classList.add('hidden');
    });
    video.addEventListener('volumechange', () => {
      const v = video.muted ? 0 : video.volume;
      const icon = v === 0 ? 'volume-x' : v < 0.5 ? 'volume-1' : 'volume-2';
      const node = $('#pl-vol-icon', root);
      if (node) { node.setAttribute('data-lucide', icon); icons(); }
      const slider = $('#pl-vol', root);
      if (slider) slider.value = String(video.muted ? 0 : video.volume);
    });

    /* -------- control buttons -------- */
    root.querySelectorAll('[data-pact]').forEach(btn => {
      btn.addEventListener('click', (e) => {

    /* -------- seek bar -------- */
    this.bindSeek();
    /* -------- gestures -------- */
    this.bindGestures();
    /* -------- volume -------- */
    const vol = $('#pl-vol', root);
    if (vol) vol.addEventListener('input', () => {

    this.syncPlayIcons();
    this.scheduleHide();
    this.setupMediaSession();

  /* centralised video styling: rotates the wrapper, not the video.
     This is the reliable approach on mobile — mobile browsers render
     <video> in a hardware layer that doesn't always obey CSS transforms,
     but a plain <div> wrapper does. */
  applyVideoStyles() {
    const v = this.video;
    const wrap = this.root && $('#pl-video-wrap', this.root);
    const stage = this.root && $('#pl-stage', this.root);
    if (!v || !wrap || !stage) return;

    const r = ((this.rotation % 360) + 360) % 360;
    const fit = this.aspect || 'contain';

    /* ---- reset wrapper geometry (all inline, no Tailwind classes) ---- */
    wrap.style.top = '';
    wrap.style.left = '';
    wrap.style.right = '';
    wrap.style.bottom = '';
    wrap.style.width = '';
    wrap.style.height = '';
    wrap.style.transform = '';
    wrap.style.transformOrigin = 'center center';

    /* ---- the video always fills the wrapper 1:1 ---- */
    v.style.position = 'absolute';
    v.style.top = '0';
    v.style.left = '0';
    v.style.right = '';
    v.style.bottom = '';
    v.style.width = '100%';
    v.style.height = '100%';
    v.style.transform = '';
    v.style.transformOrigin = 'center center';
    v.style.objectFit = fit;
    v.style.background = '#000';

    /* ---- apply rotation to the wrapper ---- */
    if (r === 90 || r === 270) {
      const W = stage.clientWidth;
      const H = stage.clientHeight;

      /* the wrapper is sized H × W (swapped), rotated 90°,
         so its visual footprint exactly matches the stage (W × H).
         Because the video inside is w-full h-full object-contain,
         it scales to fill the wrapper maximally — no stretching,
         no clipping, just small, even bars if the aspect doesn't match. */
      wrap.style.top = '50%';
      wrap.style.left = '50%';
      wrap.style.width = H + 'px';
      wrap.style.height = W + 'px';
      wrap.style.transform = `translate(-50%, -50%) rotate(${r}deg)`;
    } else if (r === 180) {
      wrap.style.transform = 'rotate(180deg)';
    }
    /* r === 0: wrapper keeps its default inset-0 sizing */
  },

  applyResume() {
    const rec = this.rec, video = this.video;
    if (!video || !rec) return;
    const s = state.settings;
    if (!s.autoResume || !s.rememberPosition) return;
    const h = state.histMap.get(rec.id);
    if (!h || h.completed || !isFinite(h.position) || h.position < 3) return;
    const dur = video.duration || 0;
    if (dur && h.position < dur - 2) {

    if (!this.video) return;
    try { await this.video.play(); } catch (_) { /* autoplay may be blocked */ }
    this.syncPlayIcons();
  },

  action(name) {
    const video = this.video;
    switch (name) {
      case 'back': this.goBack(); break;
      case 'toggle':
        if (this.isAtEnd()) {
          /* replay: rewind to the start, then play */
          try { video.currentTime = 0; } catch (_) {}
          this.syncPlayIcons();
          this.play();
          this.indicate('Replaying');
        } else {
          video.paused ? this.play() : video.pause();
        }
        break;
      case 'back10': this.seekBy(-state.settings.skipInterval); break;
      case 'fwd10': this.seekBy(state.settings.skipInterval); break;
      case 'prev': this.step(-1); break;
      case 'next': this.step(1); break;
      case 'next-cancel':
        this.clearNextCountdown();
        this.syncPlayIcons();
        this.showControls();
        this.indicate('Autoplay cancelled');
        break;
      case 'next-skip':
        this.clearNextCountdown();
        this.step(1);
        break;
      case 'rotate':
        this.rotation = ((this.rotation + 90) % 360);
        this.applyVideoStyles();
        this.indicate(this.rotation ? `Rotated ${this.rotation}°` : 'Rotation reset');
        break;
      case 'mute': video.muted = !video.muted; break;
      case 'repeat':
        this.repeat = !this.repeat;
        video.loop = this.repeat;
        $('#player-root').querySelector('[data-pact="repeat"]').classList.toggle('text-accent', this.repeat);
        this.indicate(this.repeat ? 'Repeat on' : 'Repeat off');
        break;
      case 'speed': this.openSheet(); break;
      case 'fullscreen': this.toggleFullscreen(); break;
      case 'pip': this.togglePiP(); break;
      case 'lock': this.setLocked(true); break;
      case 'unlock': this.setLocked(false); break;
      case 'sheet': this.openSheet(); break;
      case 'vmenu': this.openVideoMenu(); break;
      case 'relink': this.relink(); break;
    }
  },

  showNextCountdown(nextId) {
    const nextRec = state.videoMap.get(nextId);
    const el = this.root ? $('#pl-next-overlay', this.root) : null;
    if (!nextRec || !el) return;

    /* thumbnail */
    const thumbWrap = $('#pl-next-thumb-wrap', el);
    if (thumbWrap) {
      thumbWrap.innerHTML = thumbHTML(nextRec);
      icons();
    }

    /* title + meta line */
    $('#pl-next-title', el).textContent = nextRec.name;
    const parts = [];
    if (nextRec.duration) parts.push(fmtTime(nextRec.duration));
    if (nextRec.size)     parts.push(fmtSize(nextRec.size));
    $('#pl-next-meta', el).textContent = parts.join(' · ');

    /* playlist position — e.g. "2 / 3" */
    const posEl = $('#pl-next-pos', el);
    if (posEl) {
      if (this.playlist && this.playlist.videoIds.length) {
        posEl.textContent = `${this.index + 2} / ${this.playlist.videoIds.length}`;
      } else {
        posEl.textContent = '';
      }
    }

    /* reset countdown UI */
    const countEl = $('#pl-next-count', el);
    const ringEl  = $('#pl-next-ring', el);
    if (countEl) countEl.textContent = '5';
    if (ringEl)  ringEl.style.strokeDashoffset = '0';

    el.classList.remove('hidden');

    /* drive the 5 s timer — updates at 50 ms for a smooth ring sweep */
    const total  = 5000;
    const startAt = Date.now();
    const CIRC   = 150.796;            // 2 * π * 24 (r=24 in the SVG)

    clearInterval(this._nextInterval);
    clearTimeout(this._nextTimeout);

    this._nextInterval = setInterval(() => {
      const elapsed   = Date.now() - startAt;
      const remaining = Math.max(0, total - elapsed);
      const ratio     = remaining / total;
      const count     = Math.max(1, Math.ceil(remaining / 1000));

      if (countEl) countEl.textContent = String(count);
      if (ringEl)  ringEl.style.strokeDashoffset = String(CIRC * (1 - ratio));
    }, 50);

    this._nextTimeout = setTimeout(() => {
      this.clearNextCountdown();
      this.step(1);
    }, total);
  },

  clearNextCountdown() {
    clearInterval(this._nextInterval);
    clearTimeout(this._nextTimeout);
    this._nextInterval = null;
    this._nextTimeout = null;
    if (!this.root) return;
    const el = $('#pl-next-overlay', this.root);
    if (el) el.classList.add('hidden');
  },

  setLocked(v) {
    this.locked = v;
    const root = this.root;
    const lockedLayer = $('#pl-locked', root);
    const controls = $$('[data-controls]', root);
    if (v) {
      controls.forEach(c => c.classList.add('ctrl-hide'));
      lockedLayer.classList.remove('hidden');
      this.indicate('Controls locked');
    } else {
      lockedLayer.classList.add('hidden');
      this.showControls();
      this.indicate('Controls unlocked');
    }
  },

  seekBy(sec) {
    if (!this.video || !isFinite(this.video.duration)) return;
    this.video.currentTime = clamp(this.video.currentTime + sec, 0, this.video.duration);
    this.indicate((sec > 0 ? '+' : '') + sec + 's');
  },

  step(dir) {
    if (!this.playlist) return;
    const ids = this.playlist.videoIds;
    const next = this.index + dir;
    if (next < 0 || next >= ids.length) { toast('No more videos in this playlist'); return; }
    const id = ids[next];
    const plId = this.playlist.id;                 // save before close() clears it
    this.returnTo = this.returnTo || '#/library';
    this._carryLock = !!this.locked;               // remember lock across the hash change
    location.hash = '#/player/' + id + '?list=' + plId;
  },

  onTime() {
    const video = this.video;
    if (!video) return;
    const dur = video.duration || 0;
    const pct = dur ? (video.currentTime / dur) * 100 : 0;
    const prog = $('#pl-prog', this.root);
    const thumb = $('#pl-thumb', this.root);
    if (prog) prog.style.width = pct + '%';
    if (thumb) thumb.style.left = pct + '%';
    const cur = $('#pl-cur', this.root);
    if (cur) cur.textContent = fmtTime(video.currentTime);

    if (Date.now() - this.lastSaveAt > 5000) this.saveProgress();
    this.updatePositionState();
  },

  onBuffer() {
    const video = this.video;
    if (!video || !video.buffered || !video.buffered.length || !video.duration) return;
    let end = 0;
    for (let i = 0; i < video.buffered.length; i++) {
      if (video.buffered.start(i) <= video.currentTime && video.buffered.end(i) >= video.currentTime) {
        end = video.buffered.end(i); break;
      }
    }
    if (!end) end = video.buffered.end(video.buffered.length - 1);
    const buf = $('#pl-buf', this.root);
    if (buf) buf.style.width = clamp((end / video.duration) * 100, 0, 100) + '%';
  },

onEnded() {
  this.saveProgress(true);

  if (this.repeat) return;

  if (this.playlist) {
    const ids = this.playlist.videoIds;
    if (this.index >= 0 && this.index < ids.length - 1) {
      const nextId = ids[this.index + 1];

      this.syncPlayIcons();
      this.showControls();          /* no-op when locked — keeps controls hidden */
      this.showNextCountdown(nextId);
      return;
    }
  }

  /* last video of a playlist, or standalone video — show replay icon */
  this.syncPlayIcons();
  this.showControls();
},

  bindSeek() {
    const bar = $('#pl-seek', this.root);
    if (!bar) return;
    let dragging = false;
    const setFromEvent = (clientX, commit) => {
      const rect = bar.getBoundingClientRect();
      const pct = clamp((clientX - rect.left) / rect.width, 0, 1);
      const dur = this.video.duration || 0;
      const prog = $('#pl-prog', this.root);
      const thumb = $('#pl-thumb', this.root);
      const cur = $('#pl-cur', this.root);
      if (prog) prog.style.width = (pct * 100) + '%';
      if (thumb) thumb.style.left = (pct * 100) + '%';
      if (cur) cur.textContent = fmtTime(pct * dur);
      if (commit && dur) {
        try { this.video.currentTime = pct * dur; } catch (_) {}
      }
    };
    bar.addEventListener('pointerdown', (e) => {
      dragging = true;
      bar.setPointerCapture && bar.setPointerCapture(e.pointerId);
      setFromEvent(e.clientX, false);
      e.stopPropagation();
    });
    bar.addEventListener('pointermove', (e) => {
      if (dragging) {
        setFromEvent(e.clientX, false);
        e.stopPropagation();
        return;
      }
      // desktop hover tooltip
      const rect = bar.getBoundingClientRect();
      const pct = clamp((e.clientX - rect.left) / rect.width, 0, 1);
      const dur = this.video.duration || 0;
      const tip = $('#pl-seek-tooltip', this.root);
      if (tip) {
        tip.style.left = (pct * 100) + '%';
        tip.style.opacity = '1';
        tip.textContent = fmtTime(pct * dur);
      }
    });
    bar.addEventListener('pointerleave', () => {
      const tip = $('#pl-seek-tooltip', this.root);
      if (tip) tip.style.opacity = '0';
    });
    const end = (e) => {
      if (!dragging) return;
      dragging = false;
      setFromEvent(e.clientX, true);
      this.showControls();
      e.stopPropagation();
    };
    bar.addEventListener('pointerup', end);
    bar.addEventListener('pointercancel', end);
  },

  bindGestures() {
    const layer = $('#pl-gesture', this.root);
    if (!layer) return;
    const video = this.video;

    let startX = 0, startY = 0, active = false;
    let mode = null;               // 'v' | null
    let startVol = 1, startBright = 1;
    let longPressTimer = null, longPressActive = false;
    let lastTapAt = 0, lastTapX = 0, tapTimer = null;

    const clear = () => {
      clearTimeout(longPressTimer);
      longPressTimer = null;
      active = false;
      mode = null;
    };

    layer.addEventListener('pointerdown', (e) => {
      if (this.locked) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      active = true;
      mode = null;
      longPressActive = false;
      startX = e.clientX; startY = e.clientY;
      startVol = video.muted ? 0 : video.volume;
      startBright = this.brightness;
      clearTimeout(longPressTimer);
      longPressTimer = setTimeout(() => {
        if (active && !mode) {
          longPressActive = true;
          video.playbackRate = 2;
          this.indicate('2x speed ▶▶');
        }
      }, 520);
      try { layer.setPointerCapture(e.pointerId); } catch (_) {}
    });

    layer.addEventListener('pointermove', (e) => {
      if (!active) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (!mode && Math.abs(dy) > 14 && Math.abs(dy) > Math.abs(dx)) {
        mode = 'v';
        clearTimeout(longPressTimer);
      }
      if (mode === 'v') {
        const rect = layer.getBoundingClientRect();
        const ratio = -dy / Math.max(rect.height, 1);
        const leftSide = (e.clientX - rect.left) < rect.width / 2;
        if (leftSide) {
          const v = clamp(startVol + ratio * 1.4, 0, 1);
          video.volume = v;
          video.muted = v === 0;
          const volIcon = v === 0 ? 'volume-x' : v < 0.5 ? 'volume-1' : 'volume-2';
          this.showHud(volIcon, Math.round(v * 100) + '%', v);
        } else {
          const b = clamp(startBright + ratio * 1.4, 0.2, 1);
          this.setBrightness(b);
          this.showHud('sun', Math.round(b * 100) + '%', (b - 0.2) / 0.8);
        }
      }
    });

    const finish = (e) => {
      if (!active) { clear(); return; }
      clearTimeout(longPressTimer);
      if (longPressActive) {
        longPressActive = false;
        video.playbackRate = this.speed;
        active = false;
        return;
      }
      const moved = Math.hypot(e.clientX - startX, e.clientY - startY) > 14;
      if (mode === 'v' || moved) { active = false; mode = null; return; }
      active = false;

      const rect = layer.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const now = Date.now();

      if (now - lastTapAt < 300 && Math.abs(x - lastTapX) < 70) {
        clearTimeout(tapTimer);
        lastTapAt = 0;
        if (state.settings.doubleTapSeek) {
          const left = x < rect.width / 2;
          this.seekBy(left ? -state.settings.skipInterval : state.settings.skipInterval);
          this.ripple(left ? 'left' : 'right');
        }
        return;
      }
      lastTapAt = now;
      lastTapX = x;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(() => this.toggleControls(), 250);
    };

    layer.addEventListener('pointerup', finish);
    layer.addEventListener('pointercancel', (e) => { clearTimeout(longPressTimer); active = false; mode = null; if (longPressActive) { longPressActive = false; video.playbackRate = this.speed; } });
  },

  setBrightness(b) {
    this.brightness = b;
    if (this.video) this.video.style.filter = `brightness(${b})`;
  },

  ripple(side) {
    const host = $('#pl-ripple', this.root);
    if (!host) return;
    const sec = state.settings.skipInterval;
    host.innerHTML = `
      <div class="flex-1 h-full flex items-center justify-${side === 'left' ? 'start' : 'end'} px-8 md:px-16">
        <div class="flex flex-col items-center gap-1.5" style="animation: fadeIn .18s ease both;">
          <div class="w-16 h-16 rounded-full bg-black/55 backdrop-blur-md ring-1 ring-white/15 grid place-items-center">
            <i data-lucide="${side === 'left' ? 'rotate-ccw' : 'rotate-cw'}" class="w-7 h-7 text-white"></i>
          </div>
          <span class="text-[13px] font-semibold text-white drop-shadow-lg tabular-nums">${sec}s</span>
        </div>
      </div>`;
    icons();
    host.style.opacity = '1';
    setTimeout(() => { host.style.opacity = '0'; }, 620);
  },

  showHud(icon, label, level) {
    const hud = $('#pl-gesture-hud', this.root);
    if (!hud) return;
    const iconEl = $('#pl-hud-icon', this.root);
    const labelEl = $('#pl-hud-label', this.root);
    const barEl = $('#pl-hud-bar', this.root);
    if (iconEl) { iconEl.setAttribute('data-lucide', icon); icons(); }
    if (labelEl) labelEl.textContent = label;
    if (barEl) barEl.style.width = clamp(level * 100, 0, 100) + '%';
    hud.classList.remove('hidden');
    clearTimeout(this._hudTimer);
    this._hudTimer = setTimeout(() => hud.classList.add('hidden'), 850);
  },

  indicate(text) {
    const node = $('#pl-indicator', this.root);
    if (!node) return;
    node.textContent = text;
    node.style.opacity = '1';
    clearTimeout(this._indTimer);
    this._indTimer = setTimeout(() => { node.style.opacity = '0'; }, 900);
  },

  showControls() {
    clearTimeout(this.hideTimer);
    $$('[data-controls]', this.root).forEach(c => { if (!this.locked) c.classList.remove('ctrl-hide'); });
    if (!this.locked) this.scheduleHide();
  },

  hideControls() {
    if (this.locked) return;
    $$('[data-controls]', this.root).forEach(c => c.classList.add('ctrl-hide'));
  },

  toggleControls() {
    if (this.locked) { this.indicate('Controls locked'); return; }
    const anyVisible = $$('[data-controls]', this.root).some(c => !c.classList.contains('ctrl-hide'));
    if (anyVisible) this.hideControls(); else this.showControls();
  },

  scheduleHide() {
    clearTimeout(this.hideTimer);
    if (!state.settings.autoHideControls) return;
    if (!this.video || this.video.paused) return;
    this.hideTimer = setTimeout(() => this.hideControls(), 3000);
  },

  /* true when the video has finished (or is parked exactly on the last frame) */
  isAtEnd() {
    const v = this.video;
    if (!v) return false;
    if (v.ended) return true;
    /* safety net: some browsers set the `ended` flag a frame after `pause`,
       which would flash the play icon. Treat "paused at the very end" as ended. */
    return !!(v.paused && isFinite(v.duration) && v.duration > 0 &&
              v.currentTime >= v.duration - 0.15);
  },

  syncPlayIcons() {
    const paused = !this.video || this.video.paused;
    const ended  = this.isAtEnd();

    const showPlay   = paused && !ended;
    const showPause  = !paused;
    const showReplay = paused && ended;

    $$('[data-state="play"]',   this.root).forEach(n => n.classList.toggle('hidden', !showPlay));
    $$('[data-state="pause"]',  this.root).forEach(n => n.classList.toggle('hidden', !showPause));
    $$('[data-state="replay"]', this.root).forEach(n => n.classList.toggle('hidden', !showReplay));
  },

  async toggleFullscreen() {
    const stage = $('#pl-stage', this.root);
    try {
      if (!document.fullscreenElement) {
        await (stage.requestFullscreen ? stage.requestFullscreen() : Promise.reject());
      } else {
        await document.exitFullscreen();
      }
    } catch (_) {
      toast('Fullscreen is not available in this browser', 'error');
    }
  },

  async togglePiP() {
    if (!document.pictureInPictureEnabled) { toast('Picture-in-Picture is not supported here', 'error'); return; }
    try {
      if (document.pictureInPictureElement) await document.exitPictureInPicture();
      else await this.video.requestPictureInPicture();
    } catch (_) { toast('Picture-in-Picture is not available', 'error'); }
  },

  async acquireWakeLock() {
    if (!state.settings.keepAwake) return;
    if (!('wakeLock' in navigator)) return;
    try {
      if (!this.wakeLock) this.wakeLock = await navigator.wakeLock.request('screen');
    } catch (_) {}
  },
  releaseWakeLock() {
    try { this.wakeLock && this.wakeLock.release(); } catch (_) {}
    this.wakeLock = null;
  },

  startSaveLoop() {
    clearInterval(this.saveTimer);
    this.saveTimer = setInterval(() => this.saveProgress(), 5000);
  },
  stopSaveLoop() { clearInterval(this.saveTimer); this.saveTimer = null; },

  async saveProgress(force = false) {
    const video = this.video, rec = this.rec;
    if (!video || !rec) return;
    if (!state.settings.rememberPosition && !force) return;
    const dur = video.duration;
    if (!isFinite(dur) || dur <= 0) return;
    const pos = video.currentTime;
    const completed = pos / dur >= 0.95;
    const entry = {
      videoId: rec.id,
      position: completed ? dur : pos,
      duration: dur,
      lastWatchedAt: Date.now(),
      completed
    };
    this.lastSaveAt = Date.now();
    state.histMap.set(rec.id, entry);
    const idx = state.history.findIndex(h => h.videoId === rec.id);
    if (idx >= 0) state.history[idx] = entry; else state.history.push(entry);

    const vIdx = state.videos.findIndex(v => v.id === rec.id);
    if (vIdx >= 0) state.videos[vIdx].lastPlayedAt = Date.now();

    try {
      await dbPut('history', entry);
      const vrec = state.videos[vIdx];
      if (vrec) await dbPut('videos', vrec);
    } catch (_) {}
  },

  updatePositionState() {
    if (!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
    const video = this.video;
    if (!video || !isFinite(video.duration) || video.duration <= 0) return;
    try {
      navigator.mediaSession.setPositionState({
        duration: video.duration,
        playbackRate: video.playbackRate,
        position: clamp(video.currentTime, 0, video.duration)
      });
    } catch (_) {}
  },

  setupMediaSession() {
    if (!('mediaSession' in navigator) || !this.rec) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: this.rec.name,
        artist: 'Playora',
        album: 'Local Library'
      });
      const v = this.video;
      navigator.mediaSession.setActionHandler('play', () => this.play());
      navigator.mediaSession.setActionHandler('pause', () => v.pause());
      navigator.mediaSession.setActionHandler('seekbackward', () => this.seekBy(-state.settings.skipInterval));
      navigator.mediaSession.setActionHandler('seekforward', () => this.seekBy(state.settings.skipInterval));
      if (this.playlist) {
        navigator.mediaSession.setActionHandler('previoustrack', () => this.step(-1));
        navigator.mediaSession.setActionHandler('nexttrack', () => this.step(1));
      }
    } catch (_) {}
  },

  /* ------------------------- player settings sheet ------------------------ */
  openSheet() {
    const root = $('#player-root');
    const video = this.video;
    const speeds = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
    const aspects = [
      { key: 'contain', label: 'Fit' },
      { key: 'cover', label: 'Fill' },
      { key: 'fill', label: 'Stretch' },

    ];

    const wrap = document.createElement('div');
    wrap.className = 'fixed inset-0 z-[70] flex items-end md:items-center justify-center';

      <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" data-close></div>
      <div class="relative w-full md:max-w-lg rounded-t-2xl md:rounded-2xl border border-line bg-panel max-h-[80vh] overflow-y-auto no-sb sheet-in">
        <div class="flex items-center gap-2 px-5 pt-4 pb-3 sticky top-0 bg-panel z-10">
          <h3 class="flex-1 text-[14.5px] font-semibold">Playback settings</h3>
          <button data-close class="w-8 h-8 grid place-items-center rounded-full text-white/50 hover:text-white hover:bg-white/[0.07] transition">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>

        <div class="px-5 pb-5 space-y-5">
          <div>
            <p class="text-[11px] uppercase tracking-wider text-muted font-medium mb-2">Playback speed</p>
            <div class="flex flex-wrap gap-1.5" data-speeds>
              ${speeds.map(s => `<button data-speed="${s}" class="h-9 px-3 rounded-lg text-[12.5px] font-medium border transition ${this.speed === s ? 'bg-accent border-accent text-white' : 'border-line text-white/70 hover:bg-white/[0.06]'}">${s === 1 ? '1x' : s + 'x'}</button>`).join('')}
            </div>
          </div>

          <div>
            <p class="text-[11px] uppercase tracking-wider text-muted font-medium mb-2">Aspect ratio</p>
            <div class="flex flex-wrap gap-1.5" data-aspects>
              ${aspects.map(a => `<button data-aspect="${a.key}" class="h-9 px-3 rounded-lg text-[12.5px] font-medium border transition ${this.aspect === a.key ? 'bg-accent border-accent text-white' : 'border-line text-white/70 hover:bg-white/[0.06]'}">${a.label}</button>`).join('')}
            </div>
          </div>

          <div>
            <p class="text-[11px] uppercase tracking-wider text-muted font-medium mb-2">Rotate video</p>
            <div class="flex flex-wrap gap-1.5" data-rotations>
              ${[0, 90, 180, 270].map(r => `<button data-rotation="${r}" class="h-9 px-3 rounded-lg text-[12.5px] font-medium border transition ${this.rotation === r ? 'bg-accent border-accent text-white' : 'border-line text-white/70 hover:bg-white/[0.06]'}">${r}°</button>`).join('')}
            </div>
          </div>

          <div class="space-y-1">
            <button data-sheet-action="subtitles" class="w-full flex items-center gap-3 px-1 py-2.5 rounded-lg hover:bg-white/[0.04] transition text-left">
              <i data-lucide="subtitles" class="w-4 h-4 text-white/60"></i>
              <span class="flex-1 text-[13px]">Load subtitles (.srt / .vtt)</span>
              <i data-lucide="chevron-right" class="w-4 h-4 text-white/25"></i>
            </button>
            <button data-sheet-action="audio" class="w-full flex items-center gap-3 px-1 py-2.5 rounded-lg hover:bg-white/[0.04] transition text-left">
              <i data-lucide="audio-lines" class="w-4 h-4 text-white/60"></i>
