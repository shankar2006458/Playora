          </div>
        </div>
      </div>`;

    root.appendChild(wrap);
    icons();

    const close = () => { wrap.remove(); document.removeEventListener('keydown', onKey); };
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);
    wrap.querySelectorAll('[data-close]').forEach(n => n.addEventListener('click', close));

    wrap.querySelectorAll('[data-speed]').forEach(btn => {
      btn.addEventListener('click', () => {
        const s = Number(btn.dataset.speed);
        this.setSpeed(s);
        wrap.querySelectorAll('[data-speed]').forEach(b => {
          const on = Number(b.dataset.speed) === s;
          b.className = `h-9 px-3 rounded-lg text-[12.5px] font-medium border transition ${on ? 'bg-accent border-accent text-white' : 'border-line text-white/70 hover:bg-white/[0.06]'}`;
        });
      });
    });

    wrap.querySelectorAll('[data-aspect]').forEach(btn => {
      btn.addEventListener('click', () => {
        const a = btn.dataset.aspect;
        this.aspect = a;
        this.applyVideoStyles();   /* respect current rotation */
        wrap.querySelectorAll('[data-aspect]').forEach(b => {
          const on = b.dataset.aspect === a;
          b.className = `h-9 px-3 rounded-lg text-[12.5px] font-medium border transition ${on ? 'bg-accent border-accent text-white' : 'border-line text-white/70 hover:bg-white/[0.06]'}`;
        });
      });
    });

    wrap.querySelectorAll('[data-rotation]').forEach(btn => {
      btn.addEventListener('click', () => {
        const r = Number(btn.dataset.rotation);
        this.rotation = r;
        this.applyVideoStyles();
        wrap.querySelectorAll('[data-rotation]').forEach(b => {
          const on = Number(b.dataset.rotation) === r;
          b.className = `h-9 px-3 rounded-lg text-[12.5px] font-medium border transition ${on ? 'bg-accent border-accent text-white' : 'border-line text-white/70 hover:bg-white/[0.06]'}`;
        });
        this.indicate(r ? `Rotated ${r}°` : 'Rotation reset');
      });
    });

    wrap.querySelectorAll('[data-sleep]').forEach(btn => {
      btn.addEventListener('click', () => {
        const m = Number(btn.dataset.sleep);
        this.setSleepTimer(m);
        wrap.querySelectorAll('[data-sleep]').forEach(b => {
          const on = Number(b.dataset.sleep) === m;
          b.className = `h-9 px-3 rounded-lg text-[12.5px] font-medium border transition ${on ? 'bg-accent border-accent text-white' : 'border-line text-white/70 hover:bg-white/[0.06]'}`;
        });
      });
    });

    wrap.querySelector('[data-sheet-action="subtitles"]').addEventListener('click', () => this.loadSubtitles());
    wrap.querySelector('[data-sheet-action="audio"]').addEventListener('click', () => {
      toast(video && video.audioTracks && video.audioTracks.length ? 'Multiple audio tracks detected' : 'This browser does not expose audio tracks');
    });
    wrap.querySelector('[data-sheet-action="repeat"]').addEventListener('click', () => {
      this.repeat = !this.repeat;
      if (this.video) this.video.loop = this.repeat;
      wrap.querySelector('[data-repeat-sw]').classList.toggle('on', this.repeat);
      const mainBtn = $('#player-root').querySelector('[data-pact="repeat"]');
      if (mainBtn) mainBtn.classList.toggle('text-accent', this.repeat);
    });
    wrap.querySelector('[data-sheet-action="pip"]').addEventListener('click', () => this.togglePiP());
  },

  setSpeed(s) {
    this.speed = s;
    if (this.video) this.video.playbackRate = s;
    const label = $('#pl-speed-label', this.root);
    if (label) label.textContent = (s === 1 ? '1x' : s + 'x');
  },

  setSleepTimer(minutes) {
    clearTimeout(this.sleepTimeout);
    this.sleepTimeout = null;
    if (!minutes) { this.indicate('Sleep timer off'); return; }
    this.sleepTimeout = setTimeout(() => {
      if (this.video) this.video.pause();
      toast('Sleep timer ended — playback paused', 'default', 4000);
    }, minutes * 60000);
    this.indicate('Sleep in ' + minutes + ' min');
  },

  loadSubtitles() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.srt,.vtt,text/vtt';
    input.onchange = async () => {
      const file = input.files && input.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const cues = parseSubtitles(text);
        if (!cues.length) { toast('No subtitle cues found in this file', 'error'); return; }
        const video = this.video;
        // Remove previously added track
        if (this._track) {
          try { video.removeChild(this._track); } catch (_) {}
          this._track = null;
        }
        const track = document.createElement('track');
        track.kind = 'subtitles';
        track.label = file.name.replace(/\.[^.]+$/, '');
        track.srclang = 'en';
        track.default = true;
        this.subtitleUrl = URL.createObjectURL(new Blob([text], { type: 'text/vtt' }));
        track.src = this.subtitleUrl;
        video.appendChild(track);
        this._track = track;
        track.addEventListener('load', () => {
          try { track.track.mode = 'showing'; } catch (_) {}
        });
        setTimeout(() => { try { if (video.textTracks[0]) video.textTracks[0].mode = 'showing'; } catch (_) {} }, 300);
        toast('Subtitles loaded', 'success');
      } catch (_) {
        toast('Could not read subtitle file', 'error');
      }
    };
    input.click();
  }
};

function parseSubtitles(text) {
  const clean = String(text).replace(/\r/g, '');
  const blocks = clean.split(/\n{2,}/);
  const cues = [];
  const toSec = (t) => {
    const parts = t.replace(',', '.').split(':').map(Number);
    if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
    if (parts.length === 2) return parts[0] * 60 + parts[1];
    return Number(parts[0]) || 0;
  };
  for (const block of blocks) {
    const lines = block.split('\n').filter(l => l.trim() !== '');
    if (!lines.length) continue;
    let i = 0;
    if (/^\d+$/.test(lines[0].trim())) i = 1;
    const timeLine = lines[i];
    if (!timeLine) continue;
    const m = timeLine.match(/(\d{1,2}:\d{2}:\d{2}[.,]\d{1,3}|\d{1,2}:\d{2}[.,]\d{1,3})\s*-->\s*(\d{1,2}:\d{2}:\d{2}[.,]\d{1,3}|\d{1,2}:\d{2}[.,]\d{1,3})/);
    if (!m) continue;
    const start = toSec(m[1]);
    const end = toSec(m[2]);
    const body = lines.slice(i + 1).join('\n').replace(/<[^>]+>/g, '').trim();
    if (body) cues.push({ start, end, body });
  }
  return cues;
}

/* ------------------------------ PLAYLISTS -------------------------------- */
function playlistStats(pl) {
  const items = pl.videoIds.map(id => state.videoMap.get(id)).filter(Boolean);
  const totalDur = items.reduce((s, v) => s + (v.duration || 0), 0);
  let watchedCount = 0;
  let lastPlayedAt = 0;
  for (const v of items) {
    const h = state.histMap.get(v.id);
    if (h) {
      if (h.completed) watchedCount++;
      if (h.lastWatchedAt > lastPlayedAt) lastPlayedAt = h.lastWatchedAt;
    }
  }
  return { items, totalDur, watchedCount, lastPlayedAt };
}

/* -------------------------------- HISTORY -------------------------------- */
function viewHistory() {
  const entries = state.history
    .slice()
    .sort((a, b) => b.lastWatchedAt - a.lastWatchedAt)
    .map(h => ({ h, v: state.videoMap.get(h.videoId) }))
    .filter(x => x.v);

  const totalEntries   = entries.length;
  const completedCount = entries.filter(({ h }) => h.completed).length;
  const inProgressCount = entries.filter(({ h }) => !h.completed && (h.position || 0) > 3).length;
  const totalWatchSec  = entries.reduce((sum, { h }) => sum + (h.position || 0), 0);
  const watchTimeStr = (() => {
    if (totalWatchSec < 60) return '0m';
    const hr  = Math.floor(totalWatchSec / 3600);
    const min = Math.floor((totalWatchSec % 3600) / 60);
    if (hr >= 24) return Math.floor(hr / 24) + 'd ' + (hr % 24) + 'h';
    if (hr > 0)   return hr + 'h' + (min ? ' ' + min + 'm' : '');
    return min + 'm';
  })();

  const continueItems = entries
    .filter(({ h }) => !h.completed && (h.position || 0) > 3 && h.duration && h.position < h.duration * 0.95)
    .slice(0, 12);

  const header = `
    <header class="sticky top-0 z-30 bg-bg/90 backdrop-blur-xl border-b border-line/60">
      <div class="flex items-center gap-2 px-4 md:px-8 h-14">
        <div class="min-w-0 flex-1">
          <h1 class="text-[17px] md:text-[19px] font-semibold tracking-tight leading-none">History</h1>
          <p class="text-[10.5px] text-muted leading-none mt-1">
            ${totalEntries} entr${totalEntries === 1 ? 'y' : 'ies'}${watchTimeStr !== '0m' ? ' · ' + watchTimeStr + ' watched' : ''}
          </p>
        </div>
        ${totalEntries ? `<button data-action="clear-history" class="h-9 px-3 rounded-lg border border-line text-[12px] font-medium text-white/70 hover:bg-red-500/10 hover:text-red-300 hover:border-red-500/30 transition flex items-center gap-1.5">
          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Clear
        </button>` : ''}
      </div>
    </header>`;

  /* ---------- EMPTY STATE ---------- */
  if (!totalEntries) {
    return header + `
      <div class="flex flex-col items-center text-center py-20 px-6 fade-in">
        <div class="relative w-24 h-24 rounded-[28px] border border-line bg-panel grid place-items-center mb-6">
          <div class="absolute inset-0 rounded-[28px] bg-accent/15 blur-2xl -z-10"></div>
          <i data-lucide="history" class="w-10 h-10 text-white/25"></i>
        </div>
        <h3 class="text-[18px] font-semibold tracking-tight">No watch history</h3>
        <p class="mt-2 text-[13px] text-muted max-w-[280px] leading-relaxed">
          Videos you watch will appear here so you can pick up right where you left off.
        </p>
        <button data-action="go" data-href="#/library"
          class="mt-7 h-12 px-6 rounded-xl bg-accent hover:bg-accent2 active:scale-[0.98] transition text-[14px] font-semibold flex items-center gap-2 shadow-lg shadow-accent/20">
          <i data-lucide="library" class="w-4 h-4"></i> Browse library
        </button>
        <div class="mt-8 grid grid-cols-3 gap-2.5 w-full max-w-sm">
          <div class="rounded-xl border border-line bg-panel/70 px-2 py-3">
            <i data-lucide="history" class="w-4 h-4 text-accent mx-auto"></i>
            <p class="text-[10.5px] text-white/75 mt-1.5 font-medium">Tracked</p>
          </div>
          <div class="rounded-xl border border-line bg-panel/70 px-2 py-3">
            <i data-lucide="rotate-ccw" class="w-4 h-4 text-accent mx-auto"></i>
            <p class="text-[10.5px] text-white/75 mt-1.5 font-medium">Resume</p>
          </div>
          <div class="rounded-xl border border-line bg-panel/70 px-2 py-3">
            <i data-lucide="lock" class="w-4 h-4 text-accent mx-auto"></i>
            <p class="text-[10.5px] text-white/75 mt-1.5 font-medium">Private</p>
          </div>
        </div>
      </div>`;
  }

  /* ---------- STATS ---------- */
  const statsHtml = `
    <section class="px-4 md:px-8">
      <div class="grid grid-cols-3 gap-2 md:gap-3">
        <div class="rounded-xl border border-line bg-panel px-3 py-2.5 md:px-4 md:py-3">
          <div class="flex items-center gap-1.5 text-muted mb-1">
            <i data-lucide="clock" class="w-3 h-3 md:w-3.5 md:h-3.5"></i>
            <span class="text-[9.5px] md:text-[10px] uppercase tracking-wider font-semibold">Watched</span>
          </div>
          <p class="text-[16px] md:text-[19px] font-semibold tabular-nums leading-none">${watchTimeStr}</p>
        </div>
        <div class="rounded-xl border border-line bg-panel px-3 py-2.5 md:px-4 md:py-3">
          <div class="flex items-center gap-1.5 text-muted mb-1">
            <i data-lucide="circle-play" class="w-3 h-3 md:w-3.5 md:h-3.5"></i>
            <span class="text-[9.5px] md:text-[10px] uppercase tracking-wider font-semibold">In progress</span>
          </div>
          <p class="text-[16px] md:text-[19px] font-semibold tabular-nums leading-none">${inProgressCount}</p>
        </div>
        <div class="rounded-xl border border-line bg-panel px-3 py-2.5 md:px-4 md:py-3">
          <div class="flex items-center gap-1.5 text-muted mb-1">
            <i data-lucide="check-circle-2" class="w-3 h-3 md:w-3.5 md:h-3.5"></i>
            <span class="text-[9.5px] md:text-[10px] uppercase tracking-wider font-semibold">Completed</span>
          </div>
          <p class="text-[16px] md:text-[19px] font-semibold tabular-nums leading-none">${completedCount}</p>
        </div>
      </div>
    </section>`;

  /* ---------- CONTINUE WATCHING ---------- */
  let continueHtml = '';
  if (continueItems.length) {
    const cardW = 'w-[168px] sm:w-[196px] md:w-[228px] shrink-0 snap-start';
    continueHtml = `
      <section>
        <div class="px-4 md:px-8 flex items-center justify-between mb-3">
          <h2 class="text-[14.5px] font-semibold tracking-tight">Continue watching</h2>
          <span class="text-[11.5px] text-muted">${continueItems.length} video${continueItems.length === 1 ? '' : 's'}</span>
        </div>
        <div class="flex gap-3 overflow-x-auto no-sb snap-x snap-mandatory px-4 md:px-8 pb-1">
          ${continueItems.map(({ h, v }) => {
            const pct  = h.duration ? clamp((h.position / h.duration) * 100, 0, 100) : 0;
            const left = h.duration ? Math.max(0, h.duration - h.position) : 0;
            return `
              <div class="${cardW} group">
                <div class="relative aspect-video rounded-xl overflow-hidden bg-[#15151a] cursor-pointer ring-1 ring-white/[0.04]"
                     data-action="play" data-id="${v.id}">
                  ${thumbHTML(v)}
                  <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition"></div>
                  <div class="absolute inset-0 grid place-items-center opacity-0 group-hover:opacity-100 transition">
                    <span class="w-12 h-12 rounded-full bg-black/55 backdrop-blur-md ring-1 ring-white/25 grid place-items-center">
                      <i data-lucide="play" class="w-5 h-5 text-white fill-white translate-x-[1px]"></i>
                    </span>
                  </div>
                  <span class="absolute bottom-1.5 right-1.5 px-1.5 py-[2px] rounded-md bg-black/80 text-[10.5px] font-medium tabular-nums">
                    ${fmtTime(left)} left
                  </span>
                  <div class="absolute left-0 right-0 bottom-0 h-[3px] bg-white/25">
                    <div class="h-full bg-accent" style="width:${pct}%"></div>
                  </div>
                </div>
                <p class="mt-2 text-[12.5px] font-medium leading-snug line-clamp-1 cursor-pointer"
                   data-action="play" data-id="${v.id}">${esc(v.name)}</p>
                <p class="text-[10.5px] text-muted mt-0.5">${Math.round(pct)}% · ${esc(relTime(h.lastWatchedAt))}</p>
              </div>`;
          }).join('')}
        </div>
      </section>`;
  }

  /* ---------- GROUPED HISTORY ---------- */
  const groups = new Map();
  for (const { h, v } of entries) {
    const key = relDate(h.lastWatchedAt);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push({ h, v });
  }

  let groupsHtml = '<div class="space-y-6">';
  for (const [label, items] of groups) {
    groupsHtml += `<section>
      <div class="flex items-center gap-2 mb-2 px-1">
        <h2 class="text-[11px] uppercase tracking-wider text-muted font-semibold">${esc(label)}</h2>
        <span class="text-[10.5px] text-muted/50 tabular-nums">${items.length}</span>
      </div>
      <div class="space-y-1">
        ${items.map(({ h, v }) => {
          const pct = h.duration ? clamp((h.position / h.duration) * 100, 0, 100) : 0;
          const isDone = !!h.completed;
          return `
            <div class="group flex items-center gap-3 p-2 rounded-xl hover:bg-white/[0.035] transition">
              <div class="relative w-[108px] md:w-[132px] shrink-0 aspect-video rounded-lg overflow-hidden bg-[#15151a] cursor-pointer ring-1 ring-white/[0.04]"
                   data-action="play" data-id="${v.id}">
                ${thumbHTML(v)}
                <div class="absolute inset-0 bg-black/0 group-hover:bg-black/40 transition grid place-items-center">
                  <span class="opacity-0 group-hover:opacity-100 transition w-8 h-8 rounded-full bg-white/15 backdrop-blur grid place-items-center">
                    <i data-lucide="play" class="w-3.5 h-3.5 text-white fill-white translate-x-[1px]"></i>
                  </span>
                </div>
                ${isDone ? `<span class="absolute top-1 left-1 w-5 h-5 grid place-items-center rounded-full bg-emerald-500/90 shadow"><i data-lucide="check" class="w-2.5 h-2.5 text-white"></i></span>` : ''}
                <span class="absolute bottom-1 right-1 px-1 py-[1px] rounded bg-black/80 text-[9.5px] tabular-nums">${fmtTime(v.duration)}</span>
                ${!isDone && pct > 0.5 ? `<div class="absolute left-0 right-0 bottom-0 h-[2.5px] bg-white/20"><div class="h-full bg-accent" style="width:${pct}%"></div></div>` : ''}
              </div>
              <div class="min-w-0 flex-1 cursor-pointer" data-action="play" data-id="${v.id}">
                <p class="text-[12.5px] font-medium truncate">${esc(v.name)}</p>
                <div class="flex items-center gap-1.5 mt-0.5 text-[10.5px] text-muted flex-wrap">
                  ${isDone
                    ? `<span class="text-emerald-400/85 font-medium">Watched</span>`
                    : `<span class="tabular-nums">${fmtTime(h.position)} / ${fmtTime(h.duration)}</span>
                       <span class="text-white/25">·</span>
                       <span class="tabular-nums">${Math.round(pct)}%</span>`}
                  <span class="text-white/25">·</span>
                  <span>${esc(relTime(h.lastWatchedAt))}</span>
                </div>
                ${!isDone && pct > 0.5 ? `
                  <div class="mt-1.5 h-1 rounded-full bg-line overflow-hidden max-w-[200px]">
                    <div class="h-full bg-accent rounded-full" style="width:${pct}%"></div>
                  </div>
                ` : ''}
              </div>
              <button data-action="history-remove" data-id="${v.id}" title="Remove from history"
                class="w-8 h-8 shrink-0 grid place-items-center rounded-full text-white/30 hover:text-red-400 hover:bg-red-500/10 transition">
                <i data-lucide="x" class="w-4 h-4"></i>
              </button>
            </div>`;
        }).join('')}
      </div>
    </section>`;
  }
  groupsHtml += '</div>';

  return header + `<div class="pt-3 pb-8 space-y-6 md:space-y-8 fade-in">
    ${statsHtml}
    ${continueHtml}
    <div class="px-4 md:px-8">${groupsHtml}</div>
  </div>`;
}

/* ------------------------------- FAVORITES ------------------------------- */
function viewFavorites() {
  const all = state.favorites
    .slice()
    .sort((a, b) => b.addedAt - a.addedAt)
    .map(f => state.videoMap.get(f.videoId))
    .filter(Boolean);

  const totalDur = all.reduce((s, v) => s + (v.duration || 0), 0);
  const watchedCount = all.filter(v => {
    const h = state.histMap.get(v.id);
    return h && h.completed;
  }).length;
  const inProgressCount = all.filter(v => {
    const h = state.histMap.get(v.id);
    return h && !h.completed && (h.position || 0) > 3;
  }).length;

  const header = `
    <header class="sticky top-0 z-30 bg-bg/90 backdrop-blur-xl border-b border-line/60">
      <div class="flex items-center gap-2 px-4 md:px-8 h-14">
        <div class="min-w-0 flex-1">
          <h1 class="text-[17px] md:text-[19px] font-semibold tracking-tight leading-none">Favorites</h1>
          <p class="text-[10.5px] text-muted leading-none mt-1">
            ${all.length} video${all.length === 1 ? '' : 's'}${totalDur ? ' · ' + fmtTime(totalDur) : ''}
          </p>
        </div>
      </div>
      ${all.length ? `<div class="px-4 md:px-8 pb-3">
        <div class="relative">
          <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-muted pointer-events-none"></i>
          <input id="fav-search" type="search" value="${esc(favState.search)}" placeholder="Search favorites"
            class="w-full h-10 rounded-xl bg-surface border border-line pl-9 pr-3 text-[13px] outline-none placeholder:text-muted/70 focus:border-accent/60 transition" />
        </div>
      </div>` : ''}
    </header>`;

  /* ---------- EMPTY STATE ---------- */
  if (!all.length) {
    return header + `
      <div class="flex flex-col items-center text-center py-20 px-6 fade-in">
        <div class="relative w-24 h-24 rounded-[28px] border border-line bg-panel grid place-items-center mb-6">
          <div class="absolute inset-0 rounded-[28px] bg-red-500/10 blur-2xl -z-10"></div>
          <i data-lucide="heart" class="w-10 h-10 text-white/25"></i>
        </div>
        <h3 class="text-[18px] font-semibold tracking-tight">No favorites yet</h3>
        <p class="mt-2 text-[13px] text-muted max-w-[280px] leading-relaxed">
          Tap the ⋮ menu on any video and choose "Add to Favorites" to keep it here for quick access.
        </p>
        <button data-action="go" data-href="#/library"
          class="mt-7 h-12 px-6 rounded-xl bg-accent hover:bg-accent2 active:scale-[0.98] transition text-[14px] font-semibold flex items-center gap-2 shadow-lg shadow-accent/20">
          <i data-lucide="library" class="w-4 h-4"></i> Browse library
        </button>
        <div class="mt-8 grid grid-cols-3 gap-2.5 w-full max-w-sm">
          <div class="rounded-xl border border-line bg-panel/70 px-2 py-3">
            <i data-lucide="heart" class="w-4 h-4 text-accent mx-auto"></i>
            <p class="text-[10.5px] text-white/75 mt-1.5 font-medium">Saved</p>
          </div>
          <div class="rounded-xl border border-line bg-panel/70 px-2 py-3">
            <i data-lucide="zap" class="w-4 h-4 text-accent mx-auto"></i>
            <p class="text-[10.5px] text-white/75 mt-1.5 font-medium">Quick access</p>
          </div>
          <div class="rounded-xl border border-line bg-panel/70 px-2 py-3">
            <i data-lucide="lock" class="w-4 h-4 text-accent mx-auto"></i>
            <p class="text-[10.5px] text-white/75 mt-1.5 font-medium">Private</p>
          </div>
        </div>
      </div>`;
  }

  /* ---------- STATS ---------- */
  const statsHtml = `
    <section class="px-4 md:px-8">
      <div class="grid grid-cols-3 gap-2 md:gap-3">
        <div class="rounded-xl border border-line bg-panel px-3 py-2.5 md:px-4 md:py-3">
          <div class="flex items-center gap-1.5 text-muted mb-1">
            <i data-lucide="heart" class="w-3 h-3 md:w-3.5 md:h-3.5"></i>
            <span class="text-[9.5px] md:text-[10px] uppercase tracking-wider font-semibold">Favorites</span>
          </div>
          <p class="text-[16px] md:text-[19px] font-semibold tabular-nums leading-none">${all.length}</p>
        </div>
        <div class="rounded-xl border border-line bg-panel px-3 py-2.5 md:px-4 md:py-3">
          <div class="flex items-center gap-1.5 text-muted mb-1">
            <i data-lucide="check-circle-2" class="w-3 h-3 md:w-3.5 md:h-3.5"></i>
            <span class="text-[9.5px] md:text-[10px] uppercase tracking-wider font-semibold">Watched</span>
          </div>
          <p class="text-[16px] md:text-[19px] font-semibold tabular-nums leading-none">${watchedCount}</p>
        </div>
        <div class="rounded-xl border border-line bg-panel px-3 py-2.5 md:px-4 md:py-3">
          <div class="flex items-center gap-1.5 text-muted mb-1">
            <i data-lucide="circle-play" class="w-3 h-3 md:w-3.5 md:h-3.5"></i>
            <span class="text-[9.5px] md:text-[10px] uppercase tracking-wider font-semibold">In progress</span>
          </div>
          <p class="text-[16px] md:text-[19px] font-semibold tabular-nums leading-none">${inProgressCount}</p>
        </div>
      </div>
    </section>`;

  /* ---------- GRID OR NO-MATCH ---------- */
  const q = favState.search.trim().toLowerCase();
  const list = q ? all.filter(v => v.name.toLowerCase().includes(q)) : all;

  let bodyHtml = '';
  if (list.length) {
    bodyHtml = `
      <section class="px-4 md:px-8">
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-x-3 gap-y-6 md:gap-x-5 md:gap-y-8">
          ${list.map(videoCardGrid).join('')}
        </div>
      </section>`;
  } else {
    bodyHtml = `
      <section class="px-4 md:px-8">
        <div class="py-16 text-center">
          <div class="w-16 h-16 rounded-2xl border border-line bg-panel grid place-items-center mx-auto mb-4">
            <i data-lucide="search-x" class="w-6 h-6 text-white/25"></i>
          </div>
          <p class="text-[13.5px] font-medium">No favorites match "${esc(favState.search)}"</p>
          <p class="text-[12px] text-muted mt-1">Try a different search term.</p>
        </div>
      </section>`;
  }

  return header + `<div class="pt-3 pb-8 space-y-6 md:space-y-8 fade-in">
    ${statsHtml}
    ${bodyHtml}
  </div>`;
}

/* -------------------------------- SETTINGS ------------------------------- */
function settingRow(label, desc, control, icon = '') {
  return `
    <div class="flex items-center gap-3 py-3.5">
      ${icon ? `<div class="w-8 h-8 rounded-lg bg-white/[0.04] border border-line/60 grid place-items-center shrink-0">
        <i data-lucide="${icon}" class="w-4 h-4 text-white/45"></i>
      </div>` : ''}
      <div class="min-w-0 flex-1">
        <p class="text-[13.5px] font-medium">${esc(label)}</p>
        ${desc ? `<p class="text-[11.5px] text-muted mt-0.5 leading-snug">${esc(desc)}</p>` : ''}
      </div>
      ${control}
    </div>`;
}
function toggleControl(key, on) {
  return `<button data-action="setting-toggle" data-key="${key}" class="sw ${on ? 'on' : ''}" aria-pressed="${on}"><span></span></button>`;
}

function viewSettings() {
  const s = state.settings;
  const speeds = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
  const videoCount = state.videos.length;
  const playlistCount = state.playlists.length;
  const favoriteCount = state.favorites.length;

  return `
    <header class="sticky top-0 z-30 bg-bg/90 backdrop-blur-xl border-b border-line/60">
      <div class="flex items-center gap-1 px-2 md:px-6 h-14">
        <div class="md:hidden">${iconBtn('chevron-left', 'data-action="back"')}</div>
        <h1 class="text-[17px] md:text-[19px] font-semibold tracking-tight px-2">Settings</h1>
      </div>
    </header>

    <div class="px-4 md:px-8 py-5 max-w-2xl space-y-5 fade-in">

      <!-- ---------- APP HERO ---------- -->
      <section class="relative rounded-2xl border border-line bg-panel overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-br from-accent/10 via-transparent to-transparent pointer-events-none"></div>
        <div class="relative p-4 md:p-5 flex items-center gap-4">
          <div class="w-14 h-14 md:w-16 md:h-16 rounded-2xl bg-accent grid place-items-center shrink-0 shadow-lg shadow-accent/25">
            <i data-lucide="play" class="w-6 h-6 md:w-7 md:h-7 text-white fill-white"></i>
          </div>
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-2 flex-wrap">
              <p class="text-[16px] md:text-[18px] font-semibold tracking-tight leading-none">Playora</p>
              <span class="text-[9.5px] px-1.5 py-0.5 rounded-md bg-white/10 text-white/65 font-medium tabular-nums">v1.0.0</span>
            </div>
            <p class="text-[11.5px] text-muted mt-1.5">Your personal video player</p>
            <div class="flex items-center gap-3 mt-2 text-[10.5px] text-muted flex-wrap">
              <span class="flex items-center gap-1"><i data-lucide="film" class="w-3 h-3"></i>${videoCount} video${videoCount === 1 ? '' : 's'}</span>
              <span class="flex items-center gap-1"><i data-lucide="list-video" class="w-3 h-3"></i>${playlistCount} playlist${playlistCount === 1 ? '' : 's'}</span>
              <span class="flex items-center gap-1"><i data-lucide="heart" class="w-3 h-3"></i>${favoriteCount}</span>
            </div>
          </div>
        </div>
      </section>

      <!-- ---------- PLAYBACK ---------- -->
      <section class="rounded-2xl border border-line bg-panel">
        <div class="flex items-center gap-2 px-4 pt-4 pb-1">
          <div class="w-6 h-6 rounded-md bg-accent/15 grid place-items-center">
            <i data-lucide="play-circle" class="w-3.5 h-3.5 text-accent"></i>
          </div>
          <h2 class="text-[11px] uppercase tracking-wider text-white/80 font-semibold">Playback</h2>
        </div>
        <div class="px-4 pb-2 divide-y divide-line/40">
          ${settingRow('Default playback speed', 'Applied when a video starts', `
            <select data-action="setting-select" data-key="defaultSpeed"
              class="h-9 rounded-lg bg-surface border border-line px-2.5 text-[12.5px] outline-none focus:border-accent/60 transition">
              ${speeds.map(sp => `<option value="${sp}" ${Number(s.defaultSpeed) === sp ? 'selected' : ''}>${sp}x</option>`).join('')}
            </select>`, 'gauge')}
          ${settingRow('Auto-resume', 'Continue from where you left off', toggleControl('autoResume', s.autoResume), 'play-circle')}
          ${settingRow('Remember playback position', 'Save watch progress for every video', toggleControl('rememberPosition', s.rememberPosition), 'bookmark')}
          ${settingRow('Auto-hide controls', 'Hide player controls after 3 seconds', toggleControl('autoHideControls', s.autoHideControls), 'eye-off')}
          ${settingRow('Double-tap seeking', 'Tap twice on the sides to skip', toggleControl('doubleTapSeek', s.doubleTapSeek), 'pointer')}
          ${settingRow('Skip interval', 'Seconds skipped per gesture', `
            <select data-action="setting-select" data-key="skipInterval"
              class="h-9 rounded-lg bg-surface border border-line px-2.5 text-[12.5px] outline-none focus:border-accent/60 transition">
              ${[5, 10, 15, 30].map(n => `<option value="${n}" ${Number(s.skipInterval) === n ? 'selected' : ''}>${n}s</option>`).join('')}
            </select>`, 'fast-forward')}
          ${settingRow('Keep screen awake', 'Prevent sleep during playback', toggleControl('keepAwake', s.keepAwake), 'sun')}
        </div>
      </section>

      <!-- ---------- LIBRARY ---------- -->
      <section class="rounded-2xl border border-line bg-panel">
        <div class="flex items-center gap-2 px-4 pt-4 pb-1">
          <div class="w-6 h-6 rounded-md bg-accent/15 grid place-items-center">

async function updateStorageUsage() {
  const node    = $('#storage-usage');
  const bar     = $('#storage-bar');
  const pctNode = $('#storage-pct');
  if (!node) return;

  /* Sum of file sizes we already track — always available, no API needed */
  const libraryBytes = state.videos.reduce((s, v) => s + (v.size || 0), 0);

  /* Try the precise browser estimate (secure context only) */
  let est = null;
  try {
    if (navigator.storage && typeof navigator.storage.estimate === 'function') {
      est = await navigator.storage.estimate();
    }
  } catch (_) { /* ignore */ }

  const hasQuota = est && typeof est.quota === 'number' && isFinite(est.quota) && est.quota > 0;
  const usage    = (est && typeof est.usage === 'number' && isFinite(est.usage)) ? est.usage : libraryBytes;

  /* ---- Fallback quota ----
     Without a real quota reading, pick a "typical" 1 GB floor so the bar
     still grows as the library grows. Nudge it up in 1 GB steps if the
     library ever exceeds 800 MB, so the bar never pegs at 100 %. */
  const FALLBACK_QUOTA = Math.max(1_000_000_000,
                                  Math.ceil((libraryBytes + 1) / 800_000_000) * 1_000_000_000);
  const quota = hasQuota ? est.quota : FALLBACK_QUOTA;

  const pct = quota > 0 ? Math.min(100, (usage / quota) * 100) : 0;

  if (hasQuota) {
    node.textContent = fmtSize(usage) + ' / ' + fmtSize(quota);
    node.removeAttribute('title');
    if (bar) bar.style.width = Math.max(pct, usage > 0 ? 0.8 : 0) + '%';
    if (pctNode) pctNode.textContent = usage > 0 ? (pct < 0.1 ? '<0.1%' : pct.toFixed(1) + '%') : '—';
    return;
  }

  /* No quota available (insecure origin) — show an approximate gauge */
  if (usage > 0) {
    node.textContent = fmtSize(usage) + ' used · ~' + fmtSize(quota) + ' typical limit';
    node.setAttribute('title', 'Browser quota is not readable on this origin (needs HTTPS or localhost). Bar is scaled to a ~1 GB typical limit.');
    if (bar) bar.style.width = Math.max(pct, 0.8) + '%';   /* min 0.8 % so it's visible */
    if (pctNode) pctNode.textContent = pct < 0.1 ? '<0.1%' : pct.toFixed(1) + '%';
  } else {
    node.textContent = 'No videos stored yet';
    node.removeAttribute('title');
    if (bar) bar.style.width = '0%';
    if (pctNode) pctNode.textContent = '—';
  }
}

/* -------------------------------- ROUTER -------------------------------- */
function parseHash() {
  const raw = (location.hash || '#/home').slice(1);
  const [path, query] = raw.split('?');
  const parts = path.split('/').filter(Boolean);
  return { parts, params: new URLSearchParams(query || '') };
}

function go(hash) {
  if (location.hash === hash) { render(); return; }
  location.hash = hash;
}

function playVideo(id, listId) {
  Player.returnTo = location.hash || '#/home';
  go('#/player/' + id + (listId ? '?list=' + listId : ''));
}

const NAV_ITEMS = [
  { key: 'home', label: 'Home', icon: 'home', href: '#/home' },
  { key: 'library', label: 'Library', icon: 'library', href: '#/library' },
  { key: 'playlists', label: 'Playlists', icon: 'list-video', href: '#/playlists' },
  { key: 'history', label: 'History', icon: 'history', href: '#/history' }
];

function renderNav(active) {
  const side = $('#side-nav');
  if (side) {
    const items = [...NAV_ITEMS, { key: 'favorites', label: 'Favorites', icon: 'heart', href: '#/favorites' }, { key: 'settings', label: 'Settings', icon: 'settings', href: '#/settings' }];
    side.innerHTML = items.map(it => `
      <a href="${it.href}" class="flex items-center gap-3 px-3 h-11 rounded-xl text-[13.5px] font-medium transition
        ${active === it.key ? 'bg-accent/12 text-white' : 'text-white/60 hover:text-white hover:bg-white/[0.05]'}">
        <i data-lucide="${it.icon}" class="w-[18px] h-[18px] ${active === it.key ? 'text-accent' : ''}"></i>
        <span>${it.label}</span>
      </a>`).join('');
  }
  const bottom = $('#bottom-nav');
  if (bottom) {
    bottom.innerHTML = `<div class="grid grid-cols-4 h-[60px]">
      ${NAV_ITEMS.map(it => `
        <a href="${it.href}" class="flex flex-col items-center justify-center gap-1 transition active:scale-95">
          <i data-lucide="${it.icon}" class="w-[20px] h-[20px] ${active === it.key ? 'text-accent' : 'text-white/45'}"></i>
          <span class="text-[10px] font-medium ${active === it.key ? 'text-white' : 'text-white/45'}">${it.label}</span>
        </a>`).join('')}
    </div>`;
  }
  icons();
}

function render() {
  const { parts, params } = parseHash();
  let view = parts[0] || 'home';
  const param = parts[1] || null;

  if (view !== 'player') Player.close();

  const viewEl = $('#view');
  const activeKey = view === 'playlist' ? 'playlists' : view === 'player' ? 'library' : view;
  renderNav(activeKey);

  if (view === 'player') {
    if (!param) { go('#/library'); return; }
    Player.open(param, params.get('list'));
    return;
  }

  document.body.style.overflow = '';
  window.scrollTo(0, 0);

  switch (view) {
    case 'home':      viewEl.innerHTML = viewHome(); break;
    case 'library':   viewEl.innerHTML = viewLibrary(); renderLibraryBody(); break;
    case 'playlists': viewEl.innerHTML = viewPlaylists(); break;
    case 'playlist':  viewEl.innerHTML = viewPlaylistDetail(param); break;
    case 'history':   viewEl.innerHTML = viewHistory(); break;
    case 'favorites': viewEl.innerHTML = viewFavorites(); break;
    case 'settings':  viewEl.innerHTML = viewSettings(); updateStorageUsage(); break;
    default:          viewEl.innerHTML = viewHome(); view = 'home';
  }
  icons();
  bindViewEvents(view);
}

function refreshRoute() {
  const { parts } = parseHash();
  const view = parts[0] || 'home';
  if (view === 'player') return;
  render();
}

/* ------------------------------ view events ----------------------------- */
function bindViewEvents(view) {
  if (view === 'library') {
      const search = $('#lib-search');
      if (search) {
        search.addEventListener('input', () => { libState.search = search.value; renderLibraryBody(); });
      }
    }
  if (view === 'favorites') {
    const search = $('#fav-search');
    if (search) {
      search.addEventListener('input', () => {
        favState.search = search.value;
        const host = $('#view');
        const listHost = host.querySelector('.grid, .py-16');
        // simple re-render of the favourites body
        const scrollY = window.scrollY;
        host.innerHTML = viewFavorites();
        icons();
        bindViewEvents('favorites');
        const s2 = $('#fav-search');
        if (s2) { s2.focus(); s2.setSelectionRange(s2.value.length, s2.value.length); }
        window.scrollTo(0, scrollY);
      });
    }
  }
}

/* ---------------------------- global actions ---------------------------- */
document.addEventListener('click', async (e) => {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;
  const id = target.dataset.id;

  switch (action) {
    case 'go':
      go(target.dataset.href || '#/home');
      break;

    case 'back':
      history.length > 1 ? history.back() : go('#/home');
      break;

    case 'go-search':
      go('#/library');
      setTimeout(() => { const s = $('#lib-search'); if (s) s.focus(); }, 120);
      break;

    case 'import':
      pickAndImport();
      break;

    case 'play': {
      const listId = target.dataset.list || null;
      playVideo(id, listId);
      break;
    }

    case 'vmenu': {
      e.preventDefault();
      const rect = target.getBoundingClientRect();
      const isFav = state.favMap.has(id);
      const items = [
        { label: 'Play', icon: 'play', onClick: () => playVideo(id) },
        { label: isFav ? 'Remove from Favorites' : 'Add to Favorites', icon: 'heart', onClick: () => toggleFavorite(id) },
        { label: 'Add to Playlist', icon: 'list-plus', onClick: () => addToPlaylistDialog(id) },
        '-',
        { label: 'Rename', icon: 'pencil', onClick: () => renameVideo(id) },
        { label: 'Remove from Library', icon: 'trash-2', danger: true, onClick: () => removeVideo(id) }
      ];
      showMenu(rect.right - 218, rect.bottom + 6, items);
      break;
    }

    case 'layout': {
      libState.layout = target.dataset.layout;
      state.settings.defaultLayout = libState.layout;
      saveSettings();
      render();
      break;
    }

    case 'lib-filter': {
      libState.filter = target.dataset.key || 'all';
      const host = $('#lib-filters');
      if (host) {
        host.innerHTML = LIB_FILTERS.map(libChipHTML).join('');
        icons();
      }
      renderLibraryBody();
      break;
    }

    case 'lib-sort-menu': {
      const rect = target.getBoundingClientRect();
      const items = LIB_SORTS.map(s => ({
        label: s.label,
        icon: s.key === libState.sort ? 'check' : s.icon,
        onClick: () => {
          libState.sort = s.key;
          renderSortButton();
          renderLibraryBody();
        }
      }));
      showMenu(rect.right - 218, rect.bottom + 6, items);
      break;
    }

    case 'lib-clear': {
      libState.search = '';
      libState.filter = 'all';
      const input = $('#lib-search');
      if (input) input.value = '';
      const filtersHost = $('#lib-filters');
      if (filtersHost) {
        filtersHost.innerHTML = LIB_FILTERS.map(libChipHTML).join('');
        icons();
      }
      renderLibraryBody();
      break;
    }

    case 'new-playlist': {
      const name = await promptDialog({ title: 'New playlist', label: 'Playlist name', placeholder: 'e.g. Weekend movies', confirmText: 'Create' });
      if (name === null) break;
      if (!name) { toast('Playlist name cannot be empty', 'error'); break; }
      const pl = { id: uid('pl_'), name, createdAt: Date.now(), videoIds: [] };
      await dbPut('playlists', pl);
      state.playlists.push(pl);
      toast('Playlist created', 'success');
      render();
      break;
    }

    case 'playlist-menu': {
      const rect = target.getBoundingClientRect();
      showMenu(rect.right - 218, rect.bottom + 6, [
        { label: 'Play all', icon: 'play', onClick: () => playPlaylist(id) },
        { label: 'Rename', icon: 'pencil', onClick: () => renamePlaylist(id) },
        { label: 'Delete playlist', icon: 'trash-2', danger: true, onClick: () => deletePlaylist(id) }
      ]);
      break;
    }

    case 'open-playlist':
      go('#/playlist/' + id);
      break;

    case 'play-playlist':
      playPlaylist(id);
      break;

    case 'rename-playlist':
      renamePlaylist(id);
      break;

    case 'delete-playlist':
      deletePlaylist(id);
      break;

    case 'pl-move': {
      const dir = Number(target.dataset.dir);
      await movePlaylistItem(id, target.dataset.vid, dir);
      break;
    }

    case 'pl-remove-video': {
      const pl = state.playlists.find(p => p.id === id);
      if (!pl) break;
      pl.videoIds = pl.videoIds.filter(v => v !== target.dataset.vid);
      await dbPut('playlists', pl);
      toast('Removed from playlist');
      render();
      break;
    }

    case 'history-remove': {
      await dbDel('history', id);
      state.history = state.history.filter(h => h.videoId !== id);
      state.histMap.delete(id);
      toast('Removed from history');
      render();
      break;
    }

    case 'clear-history': {
      if (!state.history.length) { toast('History is already empty'); break; }
      const ok = await confirmDialog({
        title: 'Clear playback history?',
        message: 'This removes all watch progress and resume points. Your videos and playlists stay untouched.',
        confirmText: 'Clear history',
        danger: true
      });
      if (!ok) break;
      await dbClear('history');
      state.history = [];
      state.histMap.clear();
      toast('Playback history cleared', 'success');
      render();
      break;
    }

    case 'clear-thumbs': {
      const ok = await confirmDialog({
        title: 'Clear cached thumbnails?',
        message: 'Thumbnails will be regenerated the next time you import or relink those videos.',
        confirmText: 'Clear thumbnails',
        danger: true
      });
      if (!ok) break;
      await dbClear('thumbnails');
      state.thumbs.clear();
      toast('Thumbnail cache cleared', 'success');
      render();
      break;
    }

    case 'setting-toggle': {
      const key = target.dataset.key;
      state.settings[key] = !state.settings[key];
      saveSettings();
      target.classList.toggle('on', state.settings[key]);
      target.setAttribute('aria-pressed', String(state.settings[key]));
      if (key === 'keepAwake' && !state.settings[key]) Player.releaseWakeLock();
      break;
    }

    case 'open-theme-modal': {
      openThemeModal();
      break;
    }

    case 'pwa-install': {
      PWA.prompt();
      break;
    }
  }
});

document.addEventListener('change', (e) => {
  const sel = e.target.closest('[data-action="setting-select"]');
  if (!sel) return;
  const key = sel.dataset.key;
  let val = sel.value;
  if (key === 'defaultSpeed' || key === 'skipInterval') val = Number(val);
  state.settings[key] = val;
  if (key === 'defaultLayout') { libState.layout = val; }
  if (key === 'defaultSort') { libState.sort = val; }
  saveSettings();
});

/* ------------------------------ video ops ------------------------------- */
async function toggleFavorite(id) {
  if (state.favMap.has(id)) {
    await dbDel('favorites', id);
    state.favorites = state.favorites.filter(f => f.videoId !== id);
    state.favMap.delete(id);
    toast('Removed from Favorites');
  } else {
    const rec = { videoId: id, addedAt: Date.now() };
    await dbPut('favorites', rec);
    state.favorites.push(rec);
    state.favMap.set(id, rec);
    toast('Added to Favorites', 'success');
  }
  render();
}

async function renameVideo(id) {
  const v = state.videoMap.get(id);
  if (!v) return;
  const name = await promptDialog({ title: 'Rename video', label: 'Display name', value: v.name, confirmText: 'Save' });
  if (name === null) return;
  if (!name) { toast('Name cannot be empty', 'error'); return; }
  v.name = name;
  await dbPut('videos', v);
  toast('Video renamed', 'success');
  render();
}

async function removeVideo(id) {
  const v = state.videoMap.get(id);
  if (!v) return;
  if (state.settings.confirmRemove) {
    const ok = await confirmDialog({
      title: 'Remove from library?',
      message: `“${v.name}” will be removed from Playora. The original file on your device will not be deleted.`,
      confirmText: 'Remove',
      danger: true
    });
    if (!ok) return;
  }
  await dbDel('videos', id);
  await dbDel('files', id).catch(() => {});
  await dbDel('thumbnails', id).catch(() => {});
  await dbDel('history', id).catch(() => {});
  await dbDel('favorites', id).catch(() => {});
  for (const pl of state.playlists) {
    if (pl.videoIds.includes(id)) {
      pl.videoIds = pl.videoIds.filter(x => x !== id);
      await dbPut('playlists', pl);
    }
  }
  state.videos = state.videos.filter(x => x.id !== id);
  state.videoMap.delete(id);
  state.thumbs.delete(id);
  state.histMap.delete(id);
  state.favMap.delete(id);
  state.history = state.history.filter(h => h.videoId !== id);
  state.favorites = state.favorites.filter(f => f.videoId !== id);
  toast('Removed from library');
  render();
}

  const body = list.length
    ? `<div class="space-y-1 max-h-[46vh] overflow-y-auto no-sb">
        ${list.map(pl => {
          const inIt = pl.videoIds.includes(videoId);

            <div class="w-9 h-9 rounded-lg bg-surface border border-line grid place-items-center shrink-0">
              <i data-lucide="${inIt ? 'check' : 'list-video'}" class="w-4 h-4 ${inIt ? 'text-accent' : 'text-white/40'}"></i>
            </div>
            <div class="min-w-0 flex-1">
              <p class="text-[13px] font-medium truncate">${esc(pl.name)}</p>
              <p class="text-[10.5px] text-muted">${pl.videoIds.length} video${pl.videoIds.length === 1 ? '' : 's'}</p>
            </div>
          </button>`;
        }).join('')}
       </div>`
    : `<div class="py-6 text-center">
        <p class="text-[13px] text-muted">You don't have any playlists yet.</p>
       </div>`;

  openModal({
    title: 'Add to playlist',
    body,
    footer: `<button data-new class="w-full h-11 rounded-xl border border-line text-[13px] font-medium hover:bg-white/[0.05] transition flex items-center justify-center gap-2">
      <i data-lucide="plus" class="w-4 h-4"></i> New playlist
    </button>`,
    onMount(root, done) {
      root.querySelectorAll('[data-pl]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const pl = state.playlists.find(p => p.id === btn.dataset.pl);
          if (!pl) return;
          if (pl.videoIds.includes(videoId)) {
            pl.videoIds = pl.videoIds.filter(v => v !== videoId);
            toast('Removed from playlist');
          } else {
            pl.videoIds.push(videoId);
            toast('Added to “' + pl.name + '”', 'success');
          }
          await dbPut('playlists', pl);
          done(true);
          render();
        });
      });
      root.querySelector('[data-new]').addEventListener('click', async () => {
        const name = await promptDialog({ title: 'New playlist', label: 'Playlist name', placeholder: 'e.g. Weekend movies', confirmText: 'Create' });
        if (!name) return;
        const pl = { id: uid('pl_'), name, createdAt: Date.now(), videoIds: [videoId] };
        await dbPut('playlists', pl);
        state.playlists.push(pl);
        toast('Playlist created', 'success');
        done(true);
        render();
      });
    }
  });
}

async function renamePlaylist(id) {
  const pl = state.playlists.find(p => p.id === id);
  if (!pl) return;
  const name = await promptDialog({ title: 'Rename playlist', label: 'Playlist name', value: pl.name, confirmText: 'Save' });
  if (!name) return;
  pl.name = name;
  await dbPut('playlists', pl);
  toast('Playlist renamed', 'success');
  render();
}

async function deletePlaylist(id) {
  const pl = state.playlists.find(p => p.id === id);
  if (!pl) return;
  const ok = await confirmDialog({
    title: 'Delete playlist?',
    message: `“${pl.name}” will be deleted. The videos inside it will remain in your library.`,
    confirmText: 'Delete',
    danger: true
  });
  if (!ok) return;
  await dbDel('playlists', id);
  state.playlists = state.playlists.filter(p => p.id !== id);
  toast('Playlist deleted');
  go('#/playlists');
}

async function movePlaylistItem(plId, videoId, dir) {
  const pl = state.playlists.find(p => p.id === plId);
  if (!pl) return;
  const i = pl.videoIds.indexOf(videoId);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= pl.videoIds.length) return;
  [pl.videoIds[i], pl.videoIds[j]] = [pl.videoIds[j], pl.videoIds[i]];
  await dbPut('playlists', pl);
  render();
}

function playPlaylist(id) {
  const pl = state.playlists.find(p => p.id === id);
  if (!pl || !pl.videoIds.length) { toast('This playlist is empty', 'error'); return; }
  playVideo(pl.videoIds[0], pl.id);
}

/* ------------------------------ file input ------------------------------ */
$('#file-input').addEventListener('change', async (e) => {
  const files = e.target.files;
  if (files && files.length) await importFromFiles(files);
  e.target.value = '';
});

/* --------------------------- drag & drop import ------------------------- */
let dragDepth = 0;
window.addEventListener('dragenter', (e) => {
  if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes('Files')) return;
  dragDepth++;
  if (!$('#drop-overlay')) {
    const ov = document.createElement('div');
    ov.id = 'drop-overlay';
    ov.className = 'fixed inset-0 z-[140] bg-black/80 backdrop-blur-sm grid place-items-center pointer-events-none';
    ov.innerHTML = `<div class="rounded-2xl border-2 border-dashed border-accent/50 px-10 py-12 text-center">
        <i data-lucide="download" class="w-9 h-9 text-accent mx-auto mb-3"></i>
        <p class="text-[15px] font-semibold">Drop videos to import</p>
        <p class="text-[12px] text-white/50 mt-1">They stay on this device</p>
      </div>`;
    document.body.appendChild(ov);
    icons();
  }
});
window.addEventListener('dragleave', () => {
  dragDepth = Math.max(0, dragDepth - 1);
  if (dragDepth === 0) { const ov = $('#drop-overlay'); if (ov) ov.remove(); }
});
window.addEventListener('dragover', (e) => { e.preventDefault(); });
window.addEventListener('drop', async (e) => {
  e.preventDefault();
  dragDepth = 0;
  const ov = $('#drop-overlay'); if (ov) ov.remove();
  const files = e.dataTransfer && e.dataTransfer.files;
  if (files && files.length) await importFromFiles(files);
});

/* ----------------------------- keyboard --------------------------------- */
document.addEventListener('keydown', (e) => {
  const t = e.target;
  const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);

  if (e.key === 'Escape') {
    const modal = $('#modal-root');
    if (modal && modal.innerHTML.trim()) { closeModal(); }
    const ctx = $('#ctx-root');
    if (ctx && ctx.innerHTML.trim()) { ctx.innerHTML = ''; }
  }

  if (typing) return;
  if (!Player.isOpen || !Player.video || Player.locked) return;

  const v = Player.video;
  switch (e.key) {
    case ' ':
    case 'k':
      e.preventDefault();
      if (Player._nextTimeout) Player.clearNextCountdown();
      v.paused ? Player.play() : v.pause();
      break;
    case 'ArrowLeft':
      e.preventDefault();
      Player.seekBy(e.shiftKey ? -10 : -5);
      break;
    case 'ArrowRight':
      e.preventDefault();
      Player.seekBy(e.shiftKey ? 10 : 5);
      break;
    case 'ArrowUp':
      e.preventDefault();
      v.muted = false;
      v.volume = clamp(v.volume + 0.1, 0, 1);
      Player.indicate('Volume ' + Math.round(v.volume * 100) + '%');
      break;
    case 'ArrowDown':
      e.preventDefault();
      v.volume = clamp(v.volume - 0.1, 0, 1);
      Player.indicate('Volume ' + Math.round(v.volume * 100) + '%');
      break;
    case 'm':
    case 'M':
      v.muted = !v.muted;
      Player.indicate(v.muted ? 'Muted' : 'Unmuted');
      break;
    case 'f':
    case 'F':
      Player.toggleFullscreen();
      break;
    case '0':
      v.currentTime = 0;
      Player.indicate('Restarted');
      break;
  }
});

/* ------------------------- visibility / lifecycle ----------------------- */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && Player.isOpen) Player.saveProgress(true);
});
window.addEventListener('pagehide', () => { if (Player.isOpen) Player.saveProgress(true); });
window.addEventListener('beforeunload', () => { if (Player.isOpen) Player.saveProgress(true); });
document.addEventListener('fullscreenchange', () => {
  const icon = $('#pl-fs-icon');
  if (icon) {
    icon.setAttribute('data-lucide', document.fullscreenElement ? 'minimize' : 'maximize');
    icons();
  }
  /* stage dimensions change when entering/leaving fullscreen */
  if (Player.isOpen) {
    requestAnimationFrame(() => Player.applyVideoStyles());
  }
});

/* --------------------------------- PWA ---------------------------------- */
const PWA = {
  deferredPrompt: null,
  bannerShown: false,
  DISMISS_KEY: 'playora.installDismissed',

  isStandalone() {
    try {
      return window.matchMedia('(display-mode: standalone)').matches
          || window.matchMedia('(display-mode: fullscreen)').matches
          || window.navigator.standalone === true;
    } catch (_) { return false; }
  },

  isIOS() {
    const ua = navigator.userAgent || '';
    return /iphone|ipad|ipod/i.test(ua) && !window.MSStream;
  },

  canPrompt() {
    return !!this.deferredPrompt && !this.isStandalone();
  },

  wasDismissed() {
    try { return localStorage.getItem(this.DISMISS_KEY) === '1'; } catch (_) { return false; }
  },

  dismiss() {
    try { localStorage.setItem(this.DISMISS_KEY, '1'); } catch (_) {}
    this.hideBanner();
  },

  async prompt() {
    if (this.isStandalone()) { toast('Playora is already installed'); return 'installed'; }
    if (this.isIOS()) { this.showIOSHelp(); return 'ios-help'; }
    if (!this.deferredPrompt) { toast('Use your browser menu → Install app / Add to Home Screen'); return 'manual'; }
    try {
      this.deferredPrompt.prompt();
      const { outcome } = await this.deferredPrompt.userChoice;
      this.deferredPrompt = null;
      if (outcome === 'accepted') { this.hideBanner(); toast('Installing Playora…', 'success'); }
      return outcome;
    } catch (_) {
      toast('Install prompt unavailable — use your browser menu', 'error');
      return 'error';
    }
  },

  showIOSHelp() {
    openModal({
      title: 'Install on iOS',
      body: `
        <div class="text-[13px] leading-relaxed text-white/70 space-y-3">
          <p>Safari cannot install apps directly. Use <b class="text-white">Share → Add to Home Screen</b>:</p>
          <ol class="list-decimal list-inside space-y-2 text-white/80">
            <li>Tap the <b>Share</b> button <span class="inline-block align-middle mx-0.5"><i data-lucide="square-arrow-up" class="w-3.5 h-3.5 inline"></i></span> at the bottom of Safari.</li>
            <li>Scroll down and tap <b>Add to Home Screen</b>.</li>
            <li>Tap <b>Add</b> — Playora will appear on your home screen.</li>
          </ol>
          <p class="text-[12px] text-muted">The app icon behaves like a native app — full screen, no browser bars.</p>
        </div>`,
      footer: `<button data-ok class="w-full h-11 rounded-xl bg-accent hover:bg-accent2 active:scale-[0.99] transition text-[13.5px] font-semibold text-white">Got it</button>`,
      onMount(root, done) {
        root.querySelector('[data-ok]').addEventListener('click', () => done(true));
      }
    });
  },

  showBanner() {
    if (this.bannerShown || this.wasDismissed() || this.isStandalone()) return;
    this.bannerShown = true;
    const host = $('#pwa-banner-host');
    if (!host) return;
    host.innerHTML = `
      <div id="pwa-banner"
           class="fixed z-[105] left-3 right-3 md:left-auto md:right-6 md:w-[360px]
                  bottom-[calc(88px+env(safe-area-inset-bottom))] md:bottom-6
                  rounded-2xl border border-line bg-panel shadow-2xl shadow-black/60 backdrop-blur-xl
                  fade-in overflow-hidden">
        <div class="p-3.5 flex items-center gap-3">
          <div class="w-11 h-11 rounded-xl bg-accent grid place-items-center shrink-0 shadow-lg shadow-accent/25">
            <i data-lucide="play" class="w-5 h-5 text-white fill-white translate-x-[1px]"></i>
          </div>
          <div class="min-w-0 flex-1">
            <p class="text-[13px] font-semibold leading-tight">Install Playora</p>
            <p class="text-[11px] text-muted mt-0.5 leading-snug">Full-screen player, home-screen icon, works offline.</p>
          </div>
          <button data-pwa="close" class="w-8 h-8 grid place-items-center rounded-full text-white/45 hover:text-white hover:bg-white/[0.07] transition shrink-0" title="Dismiss">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
        <div class="px-3.5 pb-3.5 flex items-center gap-2">
          <button data-pwa="install"
            class="flex-1 h-10 rounded-lg bg-accent hover:bg-accent2 active:scale-[0.98] transition text-[12.5px] font-semibold text-white flex items-center justify-center gap-1.5">
            <i data-lucide="download" class="w-3.5 h-3.5"></i> Install
          </button>
          <button data-pwa="later"
            class="h-10 px-3 rounded-lg border border-line text-[12px] font-medium text-white/70 hover:bg-white/[0.05] transition">
            Not now
          </button>
        </div>
      </div>`;
    icons();
    host.querySelector('[data-pwa="close"]').addEventListener('click', () => this.dismiss());
    host.querySelector('[data-pwa="later"]').addEventListener('click', () => this.dismiss());
    host.querySelector('[data-pwa="install"]').addEventListener('click', () => this.prompt());
  },

  hideBanner() {
    const b = $('#pwa-banner');
    if (b) b.remove();
  },

  settingsRowHTML() {
    if (this.isStandalone()) {
      return `
        <div class="flex items-center gap-3 py-3.5">
          <div class="w-8 h-8 rounded-lg bg-white/[0.04] border border-line/60 grid place-items-center shrink-0">
            <i data-lucide="download" class="w-4 h-4 text-white/45"></i>
          </div>
          <div class="min-w-0 flex-1">
            <p class="text-[13.5px] font-medium">Install app</p>
            <p class="text-[11.5px] text-muted mt-0.5">Running as installed app</p>
          </div>
          <span class="flex items-center gap-1 text-[11.5px] text-emerald-400/90 font-medium">
            <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> Installed
          </span>
        </div>`;
    }
    const canP = this.canPrompt();
    const ios = this.isIOS();
    const label = canP ? 'Install' : (ios ? 'Add to Home Screen' : 'How to install');
    return `
      <button data-action="pwa-install" class="w-full flex items-center gap-3 py-3.5 text-left">
        <div class="w-8 h-8 rounded-lg bg-white/[0.04] border border-line/60 grid place-items-center shrink-0">
          <i data-lucide="download" class="w-4 h-4 text-white/45"></i>
        </div>
        <div class="min-w-0 flex-1">
          <p class="text-[13.5px] font-medium">Install app</p>
          <p class="text-[11.5px] text-muted mt-0.5">Add Playora to your home screen</p>
        </div>
        <span class="flex items-center gap-1.5 text-[12px] font-medium ${canP ? 'text-accent' : 'text-white/65'}">
          ${label}
          <i data-lucide="chevron-right" class="w-4 h-4 text-white/25"></i>
        </span>
      </button>`;
  },

  init() {
    /* iOS icon — generate a PNG at runtime so iOS home screen looks native */
    (function generateAppleIcon() {
      if (document.querySelector('link[rel="apple-touch-icon"]')) return;
      try {
        const S = 180;
        const c = document.createElement('canvas');
        c.width = c.height = S;
        const g = c.getContext('2d');
        if (!g) return;
        g.fillStyle = '#7c6bff';
        if (g.roundRect) {
          g.beginPath(); g.roundRect(0, 0, S, S, S * 0.22); g.fill();
        } else {
          g.fillRect(0, 0, S, S);
        }
        g.fillStyle = '#ffffff';
        g.beginPath();
        g.moveTo(S * 0.35, S * 0.30);
        g.lineTo(S * 0.68, S * 0.50);
        g.lineTo(S * 0.35, S * 0.70);
        g.closePath();
        g.fill();
        const link = document.createElement('link');
        link.rel = 'apple-touch-icon';
        link.href = c.toDataURL('image/png');
        document.head.appendChild(link);
      } catch (_) {}
    })();

    /* Register SW */
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .catch((err) => console.warn('[Playora] SW registration failed', err));
      });
    }

    /* Listen for installable */
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      this.deferredPrompt = e;
      setTimeout(() => this.showBanner(), 1400);
      /* If the user is looking at Settings, refresh the install row live */
      if ((location.hash || '').startsWith('#/settings')) refreshRoute();
    });

    window.addEventListener('appinstalled', () => {
      this.deferredPrompt = null;
      this.hideBanner();
      try { localStorage.removeItem(this.DISMISS_KEY); } catch (_) {}
      toast('Playora installed — find it on your home screen', 'success', 4000);
      refreshRoute();
    });

    /* iOS banner — since no beforeinstallprompt fires */
    if (this.isIOS() && !this.isStandalone() && !this.wasDismissed()) {
      setTimeout(() => this.showBanner(), 2000);
    }

    /* If launched in standalone, mark dismissed so no banner ever appears */
    if (this.isStandalone()) {
      try { localStorage.setItem(this.DISMISS_KEY, '1'); } catch (_) {}
    }
  }
};

/* --------------------------------- boot --------------------------------- */
async function boot() {
  try {
    await openDB();
  } catch (err) {
    document.body.innerHTML = `<div style="min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center;font-family:Inter,sans-serif">
      <div><h1 style="font-size:18px;margin-bottom:8px">Storage unavailable</h1>
      <p style="color:#8a8a97;font-size:13px;max-width:320px;line-height:1.6">Playora needs IndexedDB to store your library.
      Please disable private browsing or allow site data, then reload.</p></div></div>`;
    return;
  }
  loadSettings();
  applyTheme(state.settings.theme);
  await loadAll();
  PWA.init();

  /* Honor the “Import” shortcut from the installed app / long-press menu */
  if (location.hash.includes('import=1')) {
    setTimeout(() => {
      try { pickAndImport(); } catch (_) {}
      history.replaceState(null, '', location.hash.replace(/[?&]import=1/, ''));
    }, 300);
  }
  window.addEventListener('hashchange', render);
  if (!location.hash) location.replace('#/home');
  render();
}

boot();
</script>
